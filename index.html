<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meine Tegernsee-Lieblinge</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f6;
  color:#17332d;
}
header{
  background:#0b6b57;
  color:white;
  padding:24px 18px;
  text-align:center;
}
header h1{
  margin:0 0 6px;
  font-size:25px;
}
main{
  max-width:900px;
  margin:auto;
  padding:18px;
}
input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border:1px solid #ccd8d4;
  border-radius:12px;
  font-size:16px;
  margin-bottom:14px;
}
.filters{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:16px;
}
.filters button{
  border:0;
  border-radius:20px;
  padding:9px 14px;
  background:#dce8e4;
}
.filters button.active{
  background:#0b6b57;
  color:white;
}
#status{
  margin:12px 0;
  padding:10px;
  font-size:14px;
}
.card{
  background:white;
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.name{
  font-size:19px;
  font-weight:bold;
}
.meta{
  color:#60736d;
  margin-top:5px;
}
.actions{
  margin-top:12px;
}
.actions a{
  text-decoration:none;
  background:#0b6b57;
  color:white;
  padding:9px 13px;
  border-radius:9px;
}
</style>
</head>

<body>

<header>
<h1>Meine Tegernsee-Lieblinge</h1>
<div>Meine zentrale Restaurantliste</div>
</header>

<main>

<input id="search" placeholder="Restaurant suchen …">

<div class="filters" id="filters"></div>

<div id="status">Daten werden geladen …</div>

<div id="list"></div>

</main>

<script>

let restaurants=[];
let filter="Alle";

const filterListe=[
"Alle",
"Restaurant",
"Alm",
"Ausflugsziel",
"Kreuth",
"Tegernsee"
];

const status=document.getElementById("status");
const list=document.getElementById("list");
const search=document.getElementById("search");

document.getElementById("filters").innerHTML=
filterListe.map(x=>
`<button data-filter="${x}">${x}</button>`
).join("");

document.querySelectorAll("[data-filter]").forEach(button=>{
button.onclick=()=>{
filter=button.dataset.filter;

document.querySelectorAll("[data-filter]").forEach(b=>{
b.classList.toggle("active",b===button);
});

anzeigen();
};
});

document.querySelector('[data-filter="Alle"]').classList.add("active");

search.oninput=anzeigen;

async function laden(){

status.textContent="Restaurantdaten werden geladen …";

try{

const url="./restaurants.json?cache="+Date.now();

const antwort=await fetch(url,{
cache:"no-store"
});

if(!antwort.ok){
throw new Error(
"HTTP-Fehler "+antwort.status
);
}

const text=await antwort.text();

if(!text){
throw new Error("restaurants.json ist leer");
}

try{
restaurants=JSON.parse(text);
}catch(e){
throw new Error(
"JSON konnte nicht gelesen werden"
);
}

if(!Array.isArray(restaurants)){
throw new Error(
"Die JSON-Datei enthält keine Restaurantliste"
);
}

restaurants.sort((a,b)=>
String(a.name||"").localeCompare(
String(b.name||""),
"de"
)
);

status.textContent=
restaurants.length+
" Restaurants geladen";

anzeigen();

}catch(e){

status.textContent=
"LADEFEHLER: "+e.message;

console.error(e);

}

}

function anzeigen(){

const suche=search.value
.toLowerCase()
.trim();

const ergebnis=restaurants.filter(r=>{

const filterOK=
filter==="Alle"||
r.category===filter||
r.location===filter;

const text=
String(r.name||"")+" "+
String(r.location||"")+" "+
String(r.category||"");

return filterOK &&
(!suche||
text.toLowerCase().includes(suche));

});

list.innerHTML=ergebnis.map(r=>{

const route=
"https://www.google.com/maps/search/?api=1&query="+
encodeURIComponent(
String(r.name||"")+" "+
String(r.location||"")
);

return `
<div class="card">

<div class="name">
${sicher(r.name)}
</div>

<div class="meta">
${sicher(r.category)} · ${sicher(r.location)}
</div>

<div class="actions">
<a href="${route}"
target="_blank"
rel="noopener">
📍 Route
</a>
</div>

</div>
`;

}).join("");

if(!ergebnis.length){
list.innerHTML="<p>Keine Treffer.</p>";
}

}

function sicher(wert){

return String(wert||"").replace(
/[&<>"']/g,
zeichen=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[zeichen])
);

}

laden();

</script>

</body>
</html>
