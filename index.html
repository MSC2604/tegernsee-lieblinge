<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b6b57">
<title>Meine Tegernsee-Lieblinge</title>
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f6;
  color:#17332d
}
header{
  background:#0b6b57;
  color:white;
  padding:18px 14px;
  position:sticky;
  top:0;
  z-index:20
}
h1{
  margin:0 0 12px;
  font-size:25px
}
.search{
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  font-size:16px
}
.controls{
  padding:12px;
  display:flex;
  gap:8px;
  flex-wrap:wrap
}
button,select{
  border:0;
  border-radius:10px;
  padding:10px 13px;
  font-size:15px;
  background:white;
  box-shadow:0 1px 4px #0002
}
button.primary{
  background:#0b6b57;
  color:white
}
button.danger{
  background:#b3261e;
  color:white
}
button.active{
  background:#0b6b57;
  color:white
}
.status{
  padding:4px 14px 10px;
  color:#56736b;
  font-size:13px
}
.card{
  background:white;
  margin:10px 12px;
  padding:15px;
  border-radius:15px;
  box-shadow:0 2px 7px #0001
}
.card h2{
  margin:0 0 5px;
  font-size:19px
}
.meta{
  color:#61756f;
  font-size:14px;
  margin-bottom:8px
}
.info{
  margin:5px 0;
  line-height:1.4
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px
}
.actions button{
  flex:1
}
.star{
  float:right;
  font-size:24px;
  background:none;
  box-shadow:none;
  padding:0
}
.empty{
  text-align:center;
  padding:40px 20px;
  color:#60756e
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:100;
  padding:12px;
  overflow:auto
}
.modalBox{
  max-width:650px;
  margin:20px auto;
  background:white;
  border-radius:18px;
  padding:18px
}
.modalBox h2{
  margin-top:0
}
.field{
  margin-bottom:11px
}
.field label{
  display:block;
  font-size:13px;
  color:#536b64;
  margin-bottom:4px
}
.field input,
.field textarea,
.field select{
  width:100%;
  padding:11px;
  border:1px solid #ccd8d4;
  border-radius:9px;
  font-size:15px;
  box-shadow:none
}
.field textarea{
  min-height:75px;
  resize:vertical
}
.modalActions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px
}
.modalActions button{
  flex:1
}
.listItem{
  border-bottom:1px solid #e2e8e5;
  padding:12px 0
}
.listItem:last-child{
  border-bottom:0
}
.small{
  font-size:13px;
  color:#657a73
}
</style>
</head>

<body>

<header>
  <h1>Meine Tegernsee-Lieblinge</h1>
  <input
    id="search"
    class="search"
    placeholder="Restaurant suchen …"
    oninput="render()"
  >
</header>

<div class="controls">
  <button class="active" onclick="setFilter('all',this)">Alle</button>
  <button onclick="setFilter('Restaurant',this)">Restaurant</button>
  <button onclick="setFilter('Alm',this)">Alm</button>
  <button onclick="setFilter('Ausflugsziel',this)">Ausflugsziel</button>
  <button onclick="setFilter('Kreuth',this)">Kreuth</button>
  <button onclick="setFilter('Tegernsee',this)">Tegernsee</button>
  <button onclick="showFavorites()">⭐ Favoriten</button>
  <button onclick="openManage()" class="primary">⚙️ Verwalten</button>
</div>

<div id="status" class="status">Google-Tabelle wird geladen …</div>
<div id="list"></div>

<!-- DETAIL -->
<div id="detailModal" class="modal">
  <div class="modalBox">
    <h2 id="detailName"></h2>
    <div id="detailContent"></div>
    <div class="modalActions">
      <button onclick="closeModal('detailModal')">Schließen</button>
    </div>
  </div>
</div>

<!-- VERWALTEN -->
<div id="manageModal" class="modal">
  <div class="modalBox">
    <h2>Restaurants verwalten</h2>

    <button class="primary" onclick="openEditor()">＋ Restaurant hinzufügen</button>

    <div id="manageList"></div>

    <div class="modalActions">
      <button onclick="closeModal('manageModal')">Schließen</button>
    </div>
  </div>
</div>

<!-- EDITOR -->
<div id="editorModal" class="modal">
  <div class="modalBox">
    <h2 id="editorTitle">Restaurant hinzufügen</h2>

    <div class="field">
      <label>Name</label>
      <input id="f_name">
    </div>

    <div class="field">
      <label>Ort</label>
      <input id="f_location">
    </div>

    <div class="field">
      <label>Kategorie</label>
      <input id="f_category">
    </div>

    <div class="field">
      <label>Adresse</label>
      <input id="f_address">
    </div>

    <div class="field">
      <label>Telefon</label>
      <input id="f_phone">
    </div>

    <div class="field">
      <label>Website</label>
      <input id="f_website">
    </div>

    <div class="field">
      <label>E-Mail</label>
      <input id="f_email">
    </div>

    <div class="field">
      <label>Öffnungszeiten</label>
      <textarea id="f_openingHours"></textarea>
    </div>

    <div class="field">
      <label>Küchenzeiten</label>
      <textarea id="f_kitchenHours"></textarea>
    </div>

    <div class="field">
      <label>Ruhetag</label>
      <input id="f_restDay">
    </div>

    <div class="field">
      <label>Hinweise</label>
      <textarea id="f_notes"></textarea>
    </div>

    <div class="modalActions">
      <button class="primary" onclick="saveRestaurant()">💾 Speichern</button>
      <button onclick="closeModal('editorModal')">Abbrechen</button>
      <button id="deleteButton" class="danger" onclick="deleteCurrentRestaurant()" style="display:none">
        🗑 Löschen
      </button>
    </div>
  </div>
</div>

<!-- Unsichtbares Ziel für die Schreibvorgänge -->
<iframe name="googleWriteFrame" id="googleWriteFrame" style="display:none"></iframe>

<script>

const GOOGLE_SHEET_API =
"https://script.google.com/macros/s/AKfycbxm492j7hZ6MFLoG2hZrrROy6Yej9WAwOtWIbckvXhFx3r9UO1KTz-uI_DfD_z0yWHE/exec";

let restaurants=[];
let currentFilter="all";
let favorites=JSON.parse(localStorage.getItem("tegernseeFavorites")||"[]");
let editingId=null;
let favoriteOnly=false;

function esc(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function safeUrl(url){
  if(!url) return "";
  try{
    const u=new URL(url);
    if(u.protocol==="http:"||u.protocol==="https:") return u.href;
  }catch(e){}
  return "";
}

function normalizeRestaurant(r){
  return {
    _id:r["_id"]||"",
    name:r["Name"]||"",
    location:r["Ort"]||"",
    category:r["Kategorie"]||"",
    address:r["Adresse"]||"",
    phone:r["Telefon"]||"",
    website:r["Website"]||"",
    email:r["E-Mail"]||"",
    openingHours:r["Öffnungszeiten"]||"",
    kitchenHours:r["Küchenzeiten"]||"",
    restDay:r["Ruhetag"]||"",
    notes:r["Hinweise"]||""
  };
}

function loadFromGoogleSheet(){
  return new Promise((resolve,reject)=>{

    const callbackName="tegernseeCallback_"+Date.now();

    const script=document.createElement("script");

    const timeout=setTimeout(()=>{
      cleanup();
      reject(new Error("Zeitüberschreitung"));
    },10000);

    function cleanup(){
      clearTimeout(timeout);

      try{
        delete window[callbackName];
      }catch(e){
        window[callbackName]=undefined;
      }

      script.remove();
    }

    window[callbackName]=function(data){

      cleanup();

      try{
        const result=(data||[])
          .map(normalizeRestaurant)
          .filter(x=>x.name);

        resolve(result);

      }catch(e){
        reject(e);
      }
    };

    script.onerror=function(){
      cleanup();
      reject(new Error("Google-Tabelle konnte nicht geladen werden"));
    };

    script.src=
      GOOGLE_SHEET_API+
      "?callback="+
      encodeURIComponent(callbackName)+
      "&t="+
      Date.now();

    document.body.appendChild(script);
  });
}

async function load(){

  document.getElementById("status").textContent=
    "Google-Tabelle wird geladen …";

  try{

    restaurants=await loadFromGoogleSheet();

    sortRestaurants();

    document.getElementById("status").textContent=
      restaurants.length+
      " Einträge · Google-Tabelle";

    render();

  }catch(error){

    document.getElementById("status").textContent=
      "Fehler beim Laden der Google-Tabelle";

    document.getElementById("list").innerHTML=
      '<div class="empty">Die Restaurantliste konnte nicht geladen werden.</div>';
  }
}

function sortRestaurants(){
  restaurants.sort((a,b)=>
    a.name.localeCompare(b.name,"de")
  );
}

function setFilter(filter,button){

  currentFilter=filter;
  favoriteOnly=false;

  document.querySelectorAll(".controls button")
    .forEach(b=>b.classList.remove("active"));

  if(button) button.classList.add("active");

  render();
}

function showFavorites(){

  favoriteOnly=true;
  currentFilter="all";

  document.querySelectorAll(".controls button")
    .forEach(b=>b.classList.remove("active"));

  render();
}

function isFavorite(id){
  return favorites.includes(id);
}

function toggleFavorite(id){

  if(isFavorite(id)){
    favorites=favorites.filter(x=>x!==id);
  }else{
    favorites.push(id);
  }

  localStorage.setItem(
    "tegernseeFavorites",
    JSON.stringify(favorites)
  );

  render();
}

function render(){

  const search=
    document.getElementById("search").value
      .toLowerCase()
      .trim();

  let data=restaurants.filter(r=>{

    const text=(
      r.name+" "+
      r.location+" "+
      r.category+" "+
      r.address
    ).toLowerCase();

    if(search && !text.includes(search))
      return false;

    if(favoriteOnly && !isFavorite(r._id))
      return false;

    if(currentFilter==="all")
      return true;

    if(
      currentFilter==="Kreuth" ||
      currentFilter==="Tegernsee"
    ){
      return r.location.toLowerCase()
        .includes(currentFilter.toLowerCase());
    }

    return r.category.toLowerCase()
      .includes(currentFilter.toLowerCase());
  });

  if(!data.length){

    document.getElementById("list").innerHTML=
      '<div class="empty">Keine passenden Restaurants gefunden.</div>';

    return;
  }

  document.getElementById("list").innerHTML=
    data.map(r=>{

      const phone=r.phone
        ? `<button onclick="callRestaurant('${esc(r.phone)}')">📞 Anrufen</button>`
        : "";

      const website=safeUrl(r.website)
        ? `<button onclick="openWebsite('${esc(safeUrl(r.website))}')">🌐 Website</button>`
        : "";

      return `
      <div class="card">

        <button class="star"
          onclick="toggleFavorite('${esc(r._id)}')">
          ${isFavorite(r._id)?"⭐":"☆"}
        </button>

        <h2>${esc(r.name)}</h2>

        <div class="meta">
          ${esc(r.location)}
          ${r.category?" · "+esc(r.category):""}
        </div>

        ${r.address?
          `<div class="info">📍 ${esc(r.address)}</div>`:""}

        ${r.openingHours?
          `<div class="info">🕐 ${esc(r.openingHours)}</div>`:""}

        ${r.restDay?
          `<div class="info">🚫 Ruhetag: ${esc(r.restDay)}</div>`:""}

        <div class="actions">

          <button onclick="showDetail('${esc(r._id)}')">
            ℹ️ Details
          </button>

          ${phone}

          ${website}

          ${r.address?
            `<button onclick="routeTo('${esc(r.address)}')">
              🗺 Route
            </button>`:""}

        </div>

      </div>
      `;
    }).join("");
}

function showDetail(id){

  const r=restaurants.find(x=>x._id===id);

  if(!r) return;

  document.getElementById("detailName").textContent=r.name;

  let html="";

  if(r.location)
    html+=`<div class="info"><b>Ort:</b> ${esc(r.location)}</div>`;

  if(r.category)
    html+=`<div class="info"><b>Kategorie:</b> ${esc(r.category)}</div>`;

  if(r.address)
    html+=`<div class="info">📍 ${esc(r.address)}</div>`;

  if(r.phone)
    html+=`<div class="info">📞 ${esc(r.phone)}</div>`;

  if(r.email)
    html+=`<div class="info">✉️ ${esc(r.email)}</div>`;

  if(r.website)
    html+=`<div class="info">🌐 ${esc(r.website)}</div>`;

  if(r.openingHours)
    html+=`<div class="info"><b>Öffnungszeiten:</b><br>${esc(r.openingHours)}</div>`;

  if(r.kitchenHours)
    html+=`<div class="info"><b>Küchenzeiten:</b><br>${esc(r.kitchenHours)}</div>`;

  if(r.restDay)
    html+=`<div class="info"><b>Ruhetag:</b> ${esc(r.restDay)}</div>`;

  if(r.notes)
    html+=`<div class="info"><b>Hinweise:</b><br>${esc(r.notes)}</div>`;

  document.getElementById("detailContent").innerHTML=html;

  document.getElementById("detailModal").style.display="block";
}
