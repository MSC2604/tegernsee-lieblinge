<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b6b57">
<title>Meine Tegernsee-Lieblinge</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f4f6f5;color:#17201d}
header{background:#0b6b57;color:white;padding:22px 16px}
h1{margin:0 0 12px;font-size:26px}
main{max-width:760px;margin:auto;padding:16px}
input,select,button{font:inherit}
input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd5d1;border-radius:12px;margin-bottom:12px}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:8px}
button{border:1px solid #ccd5d1;background:white;border-radius:10px;padding:9px 12px;cursor:pointer}
button.active{background:#0b6b57;color:white;border-color:#0b6b57}
.card{background:white;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 8px #00000012}
.name{font-size:19px;font-weight:700}
.meta{color:#66736e;margin:5px 0 9px}
.statusline{display:flex;align-items:center;gap:8px;margin:7px 0 12px;font-size:14px}
.open{color:#16784b;font-weight:700}
.closed{color:#a72e39;font-weight:700}
.unknown{color:#66736e}
.updated{font-size:12px;color:#66736e;margin:8px 0 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions a,.actions button{display:inline-block;text-decoration:none;color:#0b6b57;border:1px solid #ccd5d1;border-radius:9px;padding:8px 10px;background:white}
.favorite{margin-left:auto;border:0!important;padding:2px 4px!important;font-size:25px;line-height:1;color:#c3c9c6!important}
.favorite.on{color:#d59b00!important}
.cardhead{display:flex;align-items:flex-start;gap:8px}
#status{font-size:13px;color:#66736e;margin:8px 0}
#favInfo{font-size:13px;color:#66736e;margin:0 0 10px}
</style>
</head>

<body>

<header>
  <h1>Meine Tegernsee-Lieblinge</h1>
  <div>Meine zentrale Restaurantliste</div>
</header>

<main>

<div class="filters" id="filters"></div>
<div id="favInfo">⭐ Meine Favoriten werden nur auf diesem Gerät gespeichert.</div>
<div id="status">Daten werden geladen …</div>
<div id="list"></div>
</main>
