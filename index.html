<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b6b57">
<title>Meine Tegernsee-Lieblinge</title>
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">

<style>
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  margin:0;
  background:#f4f6f5;
  color:#17201d
}
header{
  background:#0b6b57;
  color:white;
  padding:22px 16px
}
h1{
  margin:0 0 12px;
  font-size:26px
}
main{
  max-width:760px;
  margin:auto;
  padding:16px
}
input,button{
  font:inherit
}
input{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  border:1px solid #ccd5d1;
  border-radius:12px;
  margin-bottom:12px
}
.filters{
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:8px
}
button{
  border:1px solid #ccd5d1;
  background:white;
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer
}
button.active{
  background:#0b6b57;
  color:white;
  border-color:#0b6b57
}
.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin:10px 0;
  box-shadow:0 2px 8px #00000012
}
.name{
  font-size:19px;
  font-weight:700
}
.meta{
  color:#66736e;
  margin:5px 0 9px
}
.statusline{
  display:flex;
  align-items:center;
  gap:8px;
  margin:7px 0 12px;
  font-size:14px
}
.open{
  color:#16784b;
  font-weight:700
}
.closed{
  color:#a72e39;
  font-weight:700
}
.unknown{
  color:#66736e
}
.updated{
  font-size:12px;
  color:#66736e;
  margin:8px 0 12px
}
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}
.actions a{
  display:inline-block;
  text-decoration:none;
  color:#0b6b57;
  border:1px solid #ccd5d1;
  border-radius:9px;
  padding:8px 10px;
  background:white
}
.favorite{
  margin-left:auto;
  border:0!important;
  padding:2px 4px!important;
  font-size:25px;
  line-height:1;
  color:#c3c9c6!important
}
.favorite.on{
  color:#d59b00!important
}
.cardhead{
  display:flex;
  align-items:flex-start;
  gap:8px
}
#status{
  font-size:13px;
  color:#66736e;
  margin:8px 0
}
#favInfo{
  font-size:13px;
  color:#66736e;
  margin:0 0 10px
}
</style>
</head>

<body>

<header>
  <h1>Meine Tegernsee-Lieblinge</h1>
  <div>Meine zentrale Restaurantliste</div>
</header>

<main>

<input id="search" placeholder="Restaurant suchen …">

<div class="filters" id="filters"></div>

<div id="favInfo">
  ⭐ Meine Favoriten werden nur auf diesem Gerät gespeichert.
</div>

<div id="status">
  Google-Tabelle wird geladen …
</div>

<div id="list"></div>

</main>

<script>

const GOOGLE_SHEET_API =
"https://script.google.com/macros/s/AKfycbxm492j7hZ6MFLoG2hZrrROy6Yej9WAwOtWIbckvXhFx3r9UO1KTz-uI_DfD_z0yWHE/exec";

let restaurants=[];
let filter="Alle";

const favorites=
  new Set(
    JSON.parse(
      localStorage.getItem("tegernseeFavorites")||"[]"
    )
  );

const filters=[
  "Alle",
  "Restaurant",
  "Alm",
  "Ausflugsziel",
  "Kreuth",
  "Tegernsee"
];

const list=document.getElementById("list");
const search=document.getElementById("search");

document.getElementById("filters").innerHTML=
  filters.map(x=>
    `<button data-f="${esc(x)}">${esc(x)}</button>`
  ).join("");

document.querySelectorAll("[data-f]").forEach(b=>{
  b.onclick=()=>{
    filter=b.dataset.f;

    document
      .querySelectorAll("[data-f]")
      .forEach(x=>
        x.classList.toggle("active",x===b)
      );

    render();
  };
});

document
  .querySelector("[data-f='Alle']")
  .classList.add("active");

search.oninput=render;


function esc(s){
  return String(s??"")
    .replace(/[&<>"']/g,m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m]));
}


function normalizeRestaurant(r){

  return {
    id:r["_id"]||"",
    name:r["Name"]||"",
    location:r["Ort"]||"",
    category:r["Kategorie"]||"",
    address:r["Adresse"]||"",
    phone:r["Telefon"]||"",
    website:r["Website"]||"",
    email:r["E-Mail"]||"",
    openingHours:r["Öffnungszeiten"]||"",
    kitchenHours:r["Küchenzeiten"]||"",
    restDay:r["Ruhetag"]||"",
    notes:r["Hinweise"]||""
  };

}


function keyFor(x){

  return String(
    x.id ||
    x.name ||
    ""
  ).trim().toLowerCase();

}


function toggleFavorite(key,button){

  if(favorites.has(key)){

    favorites.delete(key);

    button.classList.remove("on");
    button.textContent="☆";

  }else{

    favorites.add(key);

    button.classList.add("on");
    button.textContent="★";

  }

  localStorage.setItem(
    "tegernseeFavorites",
    JSON.stringify([...favorites])
  );

  render();

}


function todayKey(){

  return [
    "sun",
    "mon",
    "tue",
    "wed",
    "thu",
    "fri",
    "sat"
  ][new Date().getDay()];

}


function dayNames(){

  return {
    mon:["montag","mo"],
    tue:["dienstag","di"],
    wed:["mittwoch","mi"],
    thu:["donnerstag","do"],
    fri:["freitag","fr"],
    sat:["samstag","sa"],
    sun:["sonntag","so"]
  };

}


function getTodayHours(x){

  const h=x.openingHours||"";

  if(!h) return null;

  const closed=String(x.restDay||"").toLowerCase();

  const names=dayNames()[todayKey()];

  if(
    closed &&
    names.some(n=>closed.includes(n))
  ){
    return "Ruhetag";
  }

  return h;

}


function parseTime(t){

  const m=String(t||"").match(
    /(\d{1,2})[:.](\d{2})\s*[–-]\s*(\d{1,2})[:.](\d{2})/
  );

  if(!m)return null;

  return {
    from:Number(m[1])*60+Number(m[2]),
    to:Number(m[3])*60+Number(m[4])
  };

}


function openingStatus(x){

  const hours=getTodayHours(x);

  if(!hours)
    return {
      text:"Öffnungszeit nicht hinterlegt",
      cls:"unknown"
    };

  if(
    /ruhetag|geschlossen/i.test(
      String(hours)
    )
  ){
    return {
      text:"Jetzt geschlossen",
      cls:"closed"
    };
  }

  const ranges=
    String(hours).match(
      /\d{1,2}[:.]\d{2}\s*[–-]\s*\d{1,2}[:.]\d{2}/g
    );

  if(!ranges)
    return {
      text:String(hours),
      cls:"unknown"
    };

  const now=new Date();

  const minutes=
    now.getHours()*60+
    now.getMinutes();

  for(const range of ranges){

    const p=parseTime(range);

    if(
      p &&
      minutes>=p.from &&
      minutes<=p.to
    ){
      return {
        text:"Jetzt geöffnet",
        cls:"open"
      };
    }

  }

  return {
    text:"Jetzt geschlossen",
    cls:"closed"
  };

}


function render(){

  const q=
    search.value
      .toLowerCase()
      .trim();

  const data=
    restaurants.filter(x=>{

      const category=
        String(x.category||"");

      const location=
        String(x.location||"");

      const okFilter=
        filter==="Alle" ||
        category===filter ||
        location===filter;

      const text=
        (
          x.name+" "+
          location+" "+
          category
        ).toLowerCase();

      return (
        okFilter &&
        (!q || text.includes(q))
      );

    });

  data.sort((a,b)=>{

    const af=favorites.has(keyFor(a));
    const bf=favorites.has(keyFor(b));

    if(af!==bf)
      return bf-af;

    return String(a.name||"")
      .localeCompare(
        String(b.name||""),
        "de"
      );

  });


  list.innerHTML=
    data.map(x=>{

      const key=keyFor(x);
      const fav=favorites.has(key);

      const st=openingStatus(x);

      const map=
        "https://www.google.com/maps/search/?api=1&query="+
        encodeURIComponent(
          x.name+" "+(x.address||x.location||"")
        );

      return `
      <div class="card">

        <div class="cardhead">

          <div style="flex:1">

            <div class="name">
              ${esc(x.name||"Unbenannt")}
            </div>

            <div class="meta">
              ${esc(x.category||"")}
              ${x.category&&x.location?" · ":""}
              ${esc(x.location||"")}
            </div>

          </div>

          <button
            class="favorite ${fav?"on":""}"
            onclick='toggleFavorite(
              ${JSON.stringify(key)},
              this
            )'
          >
            ${fav?"★":"☆"}
          </button>

        </div>

        <div class="statusline">

          <span class="${st.cls}">
            ● ${esc(st.text)}
          </span>

        </div>

        <div class="updated">
          Daten direkt aus der Google-Tabelle
        </div>

        ${
          x.address
          ?
          `<div style="margin-bottom:10px">
             📍 ${esc(x.address)}
           </div>`
          :
          ""
        }

        <div class="actions">

          <a
            href="${map}"
            target="_blank"
            rel="noopener"
          >
            📍 Route
          </a>

          ${
            x.phone
            ?
            `<a href="tel:${esc(
              x.phone.replace(/[^\d+]/g,"")
            )}">
              📞 Anrufen
             </a>`
            :
            ""
          }

          ${
            x.website
            ?
            `<a
              href="${esc(x.website)}"
              target="_blank"
              rel="noopener"
            >
              🌐 Website
             </a>`
            :
            ""
          }

        </div>

      </div>
      `;

    }).join("")
    ||
    "<p>Keine Treffer.</p>";

}


function loadFromGoogleSheet(){

  return new Promise((resolve,reject)=>{

    const callbackName=
      "tegernseeCallback_"+Date.now();

    const script=
      document.createElement("script");

    const timeout=
      setTimeout(()=>{
        cleanup();
        reject(
          new Error("Zeitüberschreitung")
        );
      },10000);


    function cleanup(){

      clearTimeout(timeout);

      try{
        delete window[callbackName];
      }catch(e){
        window[callbackName]=undefined;
      }

      script.remove();

    }


    window[callbackName]=function(data){

      cleanup();

      try{

        const result=
          (data||[])
          .map(normalizeRestaurant)
          .filter(x=>x.name);

        resolve(result);

      }catch(e){

        reject(e);

      }

    };


    script.onerror=function(){

      cleanup();

      reject(
        new Error(
          "Google-Tabelle konnte nicht geladen werden"
        )
      );

    };


    script.src=
      GOOGLE_SHEET_API+
      "?callback="+
      encodeURIComponent(callbackName)+
      "&t="+
      Date.now();


    document.body.appendChild(script);

  });

}


async function load(){

  document.getElementById("status").textContent=
    "Google-Tabelle wird geladen …";

  try{

    restaurants=
      await loadFromGoogleSheet();

    restaurants.sort((a,b)=>
      String(a.name||"")
        .localeCompare(
          String(b.name||""),
          "de"
        )
    );

    document.getElementById("status").textContent=
      restaurants.length+
      " Einträge · Google-Tabelle";

    render();

  }catch(e){

    document.getElementById("status").textContent=
      "Google-Tabelle konnte nicht geladen werden.";

    list.innerHTML=
      "<p>Die Restaurantdaten konnten gerade nicht geladen werden.</p>";

  }

}


load();

</script>

</body>
</html>
