<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b6b57">
<title>Meine Tegernsee-Lieblinge</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f6;
  color:#17332d;
}
header{
  background:#0b6b57;
  color:white;
  padding:24px 18px;
  text-align:center;
}
header h1{
  margin:0 0 6px;
  font-size:25px;
}
header div{
  opacity:.9;
}
main{
  max-width:900px;
  margin:auto;
  padding:18px;
}
input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border:1px solid #ccd8d4;
  border-radius:12px;
  font-size:16px;
  margin-bottom:14px;
}
.filters{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:16px;
}
.filters button{
  border:0;
  border-radius:20px;
  padding:9px 14px;
  background:#dce8e4;
  color:#17332d;
}
.filters button.active{
  background:#0b6b57;
  color:white;
}
#status{
  margin:12px 0;
  font-size:14px;
  color:#52635e;
}
.card{
  background:white;
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.name{
  font-size:19px;
  font-weight:bold;
  margin-bottom:5px;
}
.meta{
  color:#60736d;
  margin-bottom:12px;
}
.actions a{
  display:inline-block;
  text-decoration:none;
  background:#0b6b57;
  color:white;
  padding:9px 13px;
  border-radius:9px;
}
</style>
</head>

<body>

<header>
  <h1>Meine Tegernsee-Lieblinge</h1>
  <div>TEST – neue index.html</div>
</header>

<main>

<input id="search" placeholder="Restaurant suchen …">

<div class="filters" id="filters"></div>

<div id="status">TEST – neue index.html</div>

<div id="list"></div>

</main>

<script>

let restaurants = [];
let filter = "Alle";

const filters = [
  "Alle",
  "Restaurant",
  "Alm",
  "Ausflugsziel",
  "Kreuth",
  "Tegernsee"
];

const list = document.getElementById("list");
const search = document.getElementById("search");

document.getElementById("filters").innerHTML =
  filters.map(x => `<button data-f="${x}">${x}</button>`).join("");

document.querySelectorAll("[data-f]").forEach(button => {
  button.onclick = () => {
    filter = button.dataset.f;

    document.querySelectorAll("[data-f]").forEach(x => {
      x.classList.toggle("active", x === button);
    });

    render();
  };
});

document.querySelector("[data-f='Alle']").classList.add("active");

search.oninput = render;

async function load(){

  try{

    const response = await fetch(
      "./restaurants.json?v=" + Date.now(),
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("restaurants.json konnte nicht geladen werden");
    }

    restaurants = await response.json();

    if(!Array.isArray(restaurants)){
      throw new Error("Restaurantdaten sind kein Array");
    }

    restaurants.sort((a,b) =>
      String(a.name || "").localeCompare(
        String(b.name || ""),
        "de"
      )
    );

    document.getElementById("status").textContent =
      restaurants.length +
      " Restaurants geladen";

    render();

  }catch(error){

    document.getElementById("status").textContent =
      "FEHLER: " + error.message;

  }

}

function render(){

  const q = search.value.toLowerCase().trim();

  const data = restaurants.filter(x => {

    const okFilter =
      filter === "Alle" ||
      x.category === filter ||
      x.location === filter;

    const text =
      (x.name || "") + " " +
      (x.location || "") + " " +
      (x.category || "");

    return okFilter &&
      (!q || text.toLowerCase().includes(q));

  });

  list.innerHTML =
    data.map(x => {

      const map =
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(
          (x.name || "") + " " + (x.location || "")
        );

      return `
        <div class="card">
          <div class="name">${esc(x.name || "")}</div>

          <div class="meta">
            ${esc(x.category || "")} ·
            ${esc(x.location || "")}
          </div>

          <div class="actions">
            <a href="${map}" target="_blank" rel="noopener">
              📍 Route
            </a>
          </div>
        </div>
      `;

    }).join("") || "<p>Keine Treffer.</p>";

}

function esc(value){

  return String(value).replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );

}

load();

</script>

</body>
</html>
