<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meine Tegernsee-Lieblinge</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f2ec;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#17352d}
.app{max-width:480px;margin:auto;min-height:100vh}
header{padding:25px 18px 18px;background:linear-gradient(150deg,#183f34,#2d6a56);color:white;border-radius:0 0 26px 26px}
.title{font-size:28px;font-weight:800}
.sub{opacity:.85;margin-top:4px}
.search{margin-top:17px;background:white;border-radius:14px;padding:12px}
.search input{border:0;outline:0;width:100%;font-size:16px}
main{padding:17px 15px 90px}
.section{display:flex;justify-content:space-between;align-items:center}
.section h2{font-size:18px}
.count{font-size:12px;color:#6f7d77}
button{font:inherit}
.add{width:100%;border:0;background:#17352d;color:white;border-radius:14px;padding:13px;margin:5px 0 12px;font-weight:700}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:13px}
.chip{border:1px solid #e4e2da;background:white;padding:8px 12px;border-radius:20px;white-space:nowrap}
.chip.active{background:#17352d;color:white}
.grid{display:grid;gap:11px}
.card{background:white;border:1px solid #e4e2da;border-radius:17px;padding:15px;cursor:pointer}
.top{display:flex;justify-content:space-between}
.name{font-weight:750;font-size:17px}
.place{font-size:13px;color:#6f7d77;margin-top:4px}
.heart{font-size:22px}
.tags{display:flex;gap:6px;margin-top:11px}
.tag{font-size:11px;background:#eef3ef;padding:5px 8px;border-radius:10px}
.row{margin-top:12px;font-size:12px;color:#6f7d77}
.detail{display:none}
.back{background:none;border:0;color:white;margin-bottom:25px}
.hero{height:130px;border-radius:18px;background:#dce6df;display:flex;align-items:center;justify-content:center;font-size:52px}
.detail h1{font-size:27px;margin-bottom:3px}
.actions,.tools{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}
.action,.tool{background:white;border:1px solid #e4e2da;border-radius:13px;padding:12px;text-align:center;font-weight:650}
.info{background:white;border:1px solid #e4e2da;border-radius:17px;padding:14px}
.info div{padding:10px 0;border-bottom:1px solid #e4e2da;display:flex;justify-content:space-between;gap:12px}
.info div:last-child{border:0}
.label{color:#6f7d77}
.note{margin-top:12px;background:white;border:1px solid #e4e2da;border-radius:17px;padding:14px}
.note textarea{width:100%;min-height:80px;border:0;outline:0;font:inherit}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}
.modalbox{width:min(480px,100%);background:white;border-radius:23px 23px 0 0;padding:20px;max-height:90vh;overflow:auto}
.field{margin:10px 0}
.field label{display:block;font-size:12px;color:#6f7d77;margin-bottom:5px}
.field input,.field select{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px;font:inherit}
.modalbuttons{display:flex;gap:8px;margin-top:15px}
.modalbuttons button{flex:1;padding:12px;border-radius:12px;border:1px solid #ddd}
.save{background:#17352d;color:white}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px}
.nav{text-align:center;font-size:11px;color:#6f7d77}
.nav b{display:block;font-size:20px;color:#17352d}
.empty{text-align:center;color:#6f7d77;padding:30px}
.error{text-align:center;color:#9b2c2c;background:#fff0f0;border:1px solid #f0cccc;border-radius:15px;padding:18px}
a{color:#17352d}
</style>
</head>

<body>

<div class="app">

<header id="header">

<div class="title">Meine Tegernsee-Lieblinge</div>

<div class="sub">
Restaurants, Almen & besondere Plätze
</div>

<div class="search">
🔎 <input id="search" placeholder="Restaurant suchen …">
</div>

</header>


<main id="home">

<div class="section">

<h2>❤️ Meine Favoriten</h2>

<span class="count" id="count"></span>

</div>


<button class="add" onclick="openAdd()">
＋ Restaurant hinzufügen
</button>


<div class="filters">

<button class="chip active" data-filter="Alle">
Alle
</button>

<button class="chip" data-filter="Restaurant">
Restaurants
</button>

<button class="chip" data-filter="Alm">
Almen
</button>

<button class="chip" data-filter="Kreuth">
Kreuth
</button>

<button class="chip" data-filter="Tegernsee">
Tegernsee
</button>

</div>


<div class="grid" id="cards"></div>

</main>


<main id="detail" class="detail">

<button class="back" onclick="showHome()">
‹ Zurück
</button>


<div class="hero" id="hero">
🍽️
</div>


<h1 id="dname"></h1>

<div class="place" id="dplace"></div>


<div class="actions">

<div class="action" onclick="openRoute()">
📍 Route
</div>

<div class="action" onclick="callPlace()">
☎️ Anrufen
</div>

</div>


<div class="tools">

<button class="tool" onclick="editPlace()">
✏️ Bearbeiten
</button>

<button class="tool" onclick="deletePlace()">
🗑️ Löschen
</button>

</div>


<div class="info">

<div>
<span class="label">📍 Adresse</span>
<span id="daddress">–</span>
</div>

<div>
<span class="label">🕐 Öffnungszeiten</span>
<span id="dhours">–</span>
</div>

<div>
<span class="label">🚫 Ruhetag</span>
<span id="dclosed">–</span>
</div>

<div>
<span class="label">☎️ Telefon</span>
<span id="dphone">–</span>
</div>

<div>
<span class="label">🌐 Webseite</span>
<span id="dweb">–</span>
</div>

<div>
<span class="label">✉️ E-Mail</span>
<span id="demail">–</span>
</div>

</div>


<div class="note">

<b>📝 Meine Notizen</b>

<textarea
id="note"
placeholder="Was möchtest du dir merken?"
></textarea>

</div>

</main>


<div class="modal" id="modal">

<div class="modalbox">

<h2 id="modalTitle">
＋ Restaurant hinzufügen
</h2>


<div class="field">
<label>Name</label>
<input id="fName">
</div>


<div class="field">
<label>Ort</label>
<input id="fPlace">
</div>


<div class="field">

<label>Kategorie</label>

<select id="fCat">

<option>Restaurant</option>
<option>Alm</option>
<option>Café</option>
<option>Biergarten</option>
<option>Ausflugsziel</option>

</select>

</div>


<div class="field">
<label>Adresse</label>
<input id="fAddress">
</div>


<div class="field">
<label>Telefon</label>
<input id="fPhone">
</div>


<div class="field">
<label>Website</label>
<input id="fWeb">
</div>


<div class="field">
<label>E-Mail</label>
<input id="fEmail">
</div>


<div class="field">
<label>Öffnungszeiten</label>
<input id="fHours">
</div>


<div class="field">
<label>Ruhetag</label>
<input id="fClosed">
</div>


<div class="modalbuttons">

<button onclick="closeModal()">
Abbrechen
</button>

<button class="save" onclick="savePlace()">
Speichern
</button>

</div>

</div>

</div>


<div class="bottom">

<div class="nav" onclick="showHome()">
<b>⌂</b>
Start
</div>

<div class="nav" onclick="document.getElementById('search').focus()">
<b>⌕</b>
Suchen
</div>

</div>

</div>


<script>

/* =========================================================
   CLOUDFLARE WORKER
   ========================================================= */

const DATA_URL =
"https://tegernsee-restaurants-api.msc4021.workers.dev";


/* =========================================================
   APP-VARIABLEN
   ========================================================= */

let restaurants = [];

let current = -1;

let filter = "Alle";

let editMode = false;

let editOriginal = null;

let adminPassword = sessionStorage.getItem(
"tegernseeAdminPassword"
) || "";


let favorites = new Set();

try {

favorites = new Set(
JSON.parse(
localStorage.getItem(
"tegernseeFavorites"
) || "[]"
)
);

} catch(e) {

favorites = new Set();

}


let notes = {};

try {

notes = JSON.parse(
localStorage.getItem(
"tegernseeNotes"
) || "{}"
);

} catch(e) {

notes = {};

}


/* =========================================================
   ADMIN-PASSWORT
   ========================================================= */

function getAdminPassword(){

if(adminPassword){

return adminPassword;

}

const password = prompt(
"Bitte dein Admin-Passwort eingeben:"
);

if(!password){

return null;

}

adminPassword = password;

sessionStorage.setItem(
"tegernseeAdminPassword",
adminPassword
);

return adminPassword;

}


/* =========================================================
   API-ANFRAGE
   ========================================================= */

async function apiRequest(
body
){

const password =
getAdminPassword();

if(!password){

throw new Error(
"Kein Admin-Passwort eingegeben."
);

}

const response =
await fetch(
DATA_URL,
{
method:"POST",

headers:{
"Content-Type":"application/json",
"Authorization":
"Bearer "+password
},

body:JSON.stringify(body)
}
);


if(response.status===401){

adminPassword="";

sessionStorage.removeItem(
"tegernseeAdminPassword"
);

throw new Error(
"Das Admin-Passwort ist falsch."
);

}


if(!response.ok){

throw new Error(
"HTTP "+response.status
);

}


const result =
await response.json();


if(result.error){

throw new Error(
result.error
);

}


return result;

}


/* =========================================================
   RESTAURANTS LADEN
   ========================================================= */

async function loadRestaurants(){

try{

const response =
await fetch(
DATA_URL+"?v="+Date.now(),
{
cache:"no-store"
}
);


if(!response.ok){

throw new Error(
"HTTP "+response.status
);

}


const data =
await response.json();


if(!Array.isArray(data)){

throw new Error(
"Ungültige Datenliste"
);

}


restaurants =
data
.map(normalizeRestaurant)
.filter(r=>r.name);


restaurants.sort(
(a,b)=>
(a.name||"").localeCompare(
(b.name||""),
"de"
)
);


render();


}catch(error){

console.error(error);


document.getElementById(
"cards"
).innerHTML =

'<div class="error">'+
'⚠️ Die Restaurantdaten konnten nicht geladen werden.<br><br>'+
'Bitte prüfe deine Internetverbindung.'+
'</div>';

}

}


/* =========================================================
   WORKER-DATEN → APP-FORMAT
   ========================================================= */

function normalizeRestaurant(r){

return {

id:
r.id || "",

name:
r.name || "",

location:
r.ort || "",

category:
r.kategorie || "Restaurant",

address:
r.adresse || "",

phone:
r.telefon || "",

website:
r.website || "",

email:
r.email || "",

openingHours:
r.oeffnungszeiten || "",

restDay:
r.ruhetag || "",

notes:
r.notizen || ""

};

}


/* =========================================================
   HAUPTLISTE
   ========================================================= */

function render(){

const q =
(
document.getElementById(
"search"
).value || ""
)
.toLowerCase()
.trim();


const list =
restaurants.filter(r=>{

const filterOK =
filter==="Alle" ||
r.category===filter ||
r.location===filter;


const searchOK =

(r.name||"")
.toLowerCase()
.includes(q)

||

(r.location||"")
.toLowerCase()
.includes(q)

||

(r.category||"")
.toLowerCase()
.includes(q);


return filterOK && searchOK;

});


document.getElementById(
"count"
).textContent =
list.length+" Einträge";


document.getElementById(
"cards"
).innerHTML =

list.map(r=>{

const index =
restaurants.indexOf(r);


return `

<div class="card"
onclick="openDetail(${index})">

<div class="top">

<div>

<div class="name">
${esc(r.name)}
</div>

<div class="place">
📍 ${esc(r.location||"")}
</div>

</div>

<div class="heart">
${favorites.has(r.name)?"❤️":"♡"}
</div>

</div>

<div class="tags">

<span class="tag">
${esc(r.category||"")}
</span>

${favorites.has(r.name)
?
'<span class="tag">Favorit</span>'
:
""}

</div>

<div class="row">

${
r.openingHours
?
"🕐 "+esc(r.openingHours)
:
"🕐 Öffnungszeiten ansehen"
}

</div>

</div>

`;

}).join("")

||

'<div class="empty">Keine Treffer gefunden.</div>';

}


/* =========================================================
   DETAILANSICHT
   ========================================================= */

function openDetail(index){

current = index;

const r =
restaurants[index];

if(!r)return;


document.getElementById(
"home"
).style.display="none";


document.getElementById(
"header"
).style.display="none";


document.getElementById(
"detail"
).style.display="block";


document.getElementById(
"dname"
).textContent =
r.name || "";


document.getElementById(
"dplace"
).textContent =
"📍 "+(r.location||"");


document.getElementById(
"daddress"
).textContent =
r.address || "–";


document.getElementById(
"dhours"
).textContent =
r.openingHours || "–";


document.getElementById(
"dclosed"
).textContent =
r.restDay || "–";


document.getElementById(
"dphone"
).textContent =
r.phone || "–";


document.getElementById(
"demail"
).textContent =
r.email || "–";


if(r.website){

document.getElementById(
"dweb"
).innerHTML =

`<a
href="${safeUrl(r.website)}"
target="_blank"
rel="noopener">
Webseite öffnen
</a>`;

}else{

document.getElementById(
"dweb"
).textContent="–";

}


document.getElementById(
"note"
).value =
notes[r.name] || "";


document.getElementById(
"note"
).oninput = function(){

notes[r.name] =
this.value;


localStorage.setItem(
"tegernseeNotes",
JSON.stringify(notes)
);

};

}


/* =========================================================
   ZURÜCK
   ========================================================= */

function showHome(){

document.getElementById(
"detail"
).style.display="none";


document.getElementById(
"home"
).style.display="block";


document.getElementById(
"header"
).style.display="block";


render();

}


/* =========================================================
   ROUTE
   ========================================================= */

function openRoute(){

const r =
restaurants[current];

if(!r)return;


location.href =
"https://www.google.com/maps/search/?api=1&query="+
encodeURIComponent(
(r.name||"")+" "+
(r.address||"")+" "+
(r.location||"")+" Tegernsee"
);

}


/* =========================================================
   ANRUFEN
   ========================================================= */

function callPlace(){

const r =
restaurants[current];

if(!r)return;


if(!r.phone){

alert(
"Keine Telefonnummer hinterlegt."
);

return;

}


location.href =
"tel:"+
r.phone.replace(
/[^0-9+]/g,
""
);

}


/* =========================================================
   HINZUFÜGEN
   ========================================================= */

function openAdd(){

editMode = false;

editOriginal = null;


document.getElementById(
"modalTitle"
).textContent =
"＋ Restaurant hinzufügen";


clearForm();


document.getElementById(
"modal"
).style.display="flex";

}


/* =========================================================
   BEARBEITEN
   ========================================================= */

function editPlace(){

if(
current<0 ||
!restaurants[current]
)return;


editOriginal = {
...restaurants[current]
};


editMode = true;


const r =
restaurants[current];


document.getElementById(
"modalTitle"
).textContent =
"✏️ Restaurant bearbeiten";


document.getElementById(
"fName"
).value =
r.name || "";


document.getElementById(
"fPlace"
).value =
r.location || "";


document.getElementById(
"fCat"
).value =
r.category || "Restaurant";


document.getElementById(
"fAddress"
).value =
r.address || "";


document.getElementById(
"fPhone"
).value =
r.phone || "";


document.getElementById(
"fWeb"
).value =
r.website || "";


document.getElementById(
"fEmail"
).value =
r.email || "";


document.getElementById(
"fHours"
).value =
r.openingHours || "";


document.getElementById(
"fClosed"
).value =
r.restDay || "";


document.getElementById(
"modal"
).style.display="flex";

}


/* =========================================================
   RESTAURANT SPEICHERN
   ========================================================= */

async function savePlace(){

const name =
document.getElementById(
"fName"
).value.trim();


if(!name){

alert(
"Bitte einen Namen eingeben."
);

return;

}


const wasEdit =
editMode;


const oldRestaurant =
editOriginal
?
{...editOriginal}
:
null;


const r = {

name:name,

location:
document.getElementById(
"fPlace"
).value.trim(),

category:
document.getElementById(
"fCat"
).value,

address:
document.getElementById(
"fAddress"
).value.trim(),

phone:
document.getElementById(
"fPhone"
).value.trim(),

website:
document.getElementById(
"fWeb"
).value.trim(),

email:
document.getElementById(
"fEmail"
).value.trim(),

openingHours:
document.getElementById(
"fHours"
).value.trim(),

restDay:
document.getElementById(
"fClosed"
).value.trim(),

notes:
oldRestaurant
?
oldRestaurant.notes || ""
:
""

};


/* =========================================================
   BEARBEITEN
   ========================================================= */

if(
wasEdit &&
oldRestaurant &&
oldRestaurant.id
){

try{

await apiRequest({

action:"update",

id:oldRestaurant.id,

restaurant:r

});


}catch(error){

console.error(error);

alert(
"⚠️ Das Restaurant konnte nicht gespeichert werden.\n\n"+
error.message
);

return;

}

}


/* =========================================================
   NEU ANLEGEN
   ========================================================= */

else{

try{

await apiRequest({

action:"create",

restaurant:r

});


}catch(error){

console.error(error);

alert(
"⚠️ Das Restaurant konnte nicht hinzugefügt werden.\n\n"+
error.message
);

return;

}

}


/* =========================================================
   ZENTRALE DATENBANK NEU LADEN
   ========================================================= */

closeModal();


editMode=false;

editOriginal=null;


await loadRestaurants();


/* Bei Bearbeitung wieder das Restaurant öffnen */

if(wasEdit){

const newIndex =
restaurants.findIndex(
x=>x.name===name
);


if(newIndex!==-1){

openDetail(newIndex);

}

}

}


/* =========================================================
   LÖSCHEN
   ========================================================= */

async function deletePlace(){

if(
current<0 ||
!restaurants[current]
)return;


const r =
restaurants[current];


if(!confirm(
"„"+r.name+"“ wirklich löschen?"
)){

return;

}


try{

await apiRequest({

action:"delete",

id:r.id

});


}catch(error){

console.error(error);

alert(
"⚠️ Das Restaurant konnte nicht gelöscht werden.\n\n"+
error.message
);

return;

}


current=-1;


await loadRestaurants();


showHome();

}


/* =========================================================
   FORMULAR LEEREN
   ========================================================= */

function clearForm(){

[
"fName",
"fPlace",
"fAddress",
"fPhone",
"fWeb",
"fEmail",
"fHours",
"fClosed"

].forEach(id=>{

document.getElementById(id).value="";

});


document.getElementById(
"fCat"
).value="Restaurant";

}


/* =========================================================
   MODAL SCHLIESSEN
   ========================================================= */

function closeModal(){

document.getElementById(
"modal"
).style.display="none";


editMode=false;

editOriginal=null;

}


/* =========================================================
   FILTER
   ========================================================= */

document.querySelectorAll(
".chip"
)
.forEach(button=>{

button.onclick=()=>{

document.querySelectorAll(
".chip"
)
.forEach(x=>
x.classList.remove("active")
);


button.classList.add("active");


filter =
button.dataset.filter;


render();

};

});


/* =========================================================
   SUCHE
   ========================================================= */

document.getElementById(
"search"
).oninput =
render;


/* =========================================================
   SICHERER TEXT
   ========================================================= */

function esc(value){

return String(value||"")

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =========================================================
   SICHERE WEBSEITE
   ========================================================= */

function safeUrl(url){

try{

const u =
new URL(url);


if(
u.protocol==="http:" ||
u.protocol==="https:"
){

return u.href;

}

}catch(e){}


return "#";

}


/* =========================================================
   APP STARTEN
   ========================================================= */

loadRestaurants();

</script>

</body>
</html>
