<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b6b57">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Meine Tegernsee-Lieblinge</title>

<style>
:root{
  --bg:#f4f6f5;
  --card:#ffffff;
  --text:#17201d;
  --muted:#66736e;
  --green:#0b6b57;
  --line:#ccd5d1;
  --gold:#d59b00;
  --red:#a72e39;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

header{
  background:linear-gradient(150deg,#174b3e,#0b6b57);
  color:white;
  padding:24px 16px 20px;
}

header h1{
  margin:0 0 7px;
  font-size:27px;
}

header div{
  opacity:.9;
}

main{
  max-width:760px;
  margin:auto;
  padding:16px 16px 80px;
}

input,select,button{
  font:inherit;
}

#search{
  width:100%;
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:13px;
  background:white;
  margin-bottom:12px;
  outline:none;
}

#search:focus{
  border-color:var(--green);
}

.filters{
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:10px;
}

.filters button{
  white-space:nowrap;
  border:1px solid var(--line);
  background:white;
  border-radius:20px;
  padding:8px 13px;
  cursor:pointer;
}

.filters button.active{
  background:var(--green);
  color:white;
  border-color:var(--green);
}

#status{
  font-size:13px;
  color:var(--muted);
  margin:8px 0 12px;
}

#list{
  display:grid;
  gap:12px;
}

.card{
  background:var(--card);
  border-radius:17px;
  padding:16px;
  box-shadow:0 2px 9px #00000012;
  border:1px solid #e4e9e6;
}

.cardhead{
  display:flex;
  gap:10px;
  align-items:flex-start;
}

.name{
  font-size:19px;
  font-weight:750;
}

.meta{
  color:var(--muted);
  margin-top:4px;
  font-size:14px;
}

.favorite{
  margin-left:auto;
  border:0;
  background:transparent;
  font-size:27px;
  line-height:1;
  padding:0 2px;
  color:#c3c9c6;
  cursor:pointer;
}

.favorite.on{
  color:var(--gold);
}

.statusline{
  margin-top:10px;
  font-size:14px;
}

.open{
  color:#16784b;
  font-weight:700;
}

.closed{
  color:var(--red);
  font-weight:700;
}

.unknown{
  color:var(--muted);
}

.details{
  margin-top:12px;
  display:grid;
  gap:5px;
  font-size:14px;
}

.detailrow b{
  font-weight:650;
}

.updated{
  margin-top:10px;
  font-size:12px;
  color:var(--muted);
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:13px;
}

.actions a,
.actions button{
  display:inline-block;
  text-decoration:none;
  color:var(--green);
  background:white;
  border:1px solid var(--line);
  border-radius:9px;
  padding:8px 11px;
  cursor:pointer;
}

.actions button.admin{
  background:var(--green);
  color:white;
  border-color:var(--green);
}

.actions button.delete{
  color:var(--red);
}

#adminPanel{
  display:none;
  background:white;
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
}

#adminPanel h2{
  margin:0 0 12px;
  font-size:20px;
}

.formgrid{
  display:grid;
  gap:9px;
}

.formgrid input,
.formgrid textarea{
  width:100%;
  padding:11px;
  border:1px solid var(--line);
  border-radius:10px;
  font:inherit;
  box-sizing:border-box;
}

.formgrid textarea{
  min-height:80px;
  resize:vertical;
}

.formbuttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

.formbuttons button{
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 13px;
  background:white;
  cursor:pointer;
}

.formbuttons .save{
  background:var(--green);
  color:white;
  border-color:var(--green);
}

#adminMessage{
  margin-top:9px;
  font-size:13px;
  color:var(--muted);
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:25px 10px;
}
</style>
</head>

<body>

<header>
  <h1>Meine Tegernsee-Lieblinge</h1>
  <div>Meine zentrale Restaurantliste</div>
</header>

<main>

<input id="search" placeholder="Restaurant suchen …">

<div class="filters" id="filters"></div>

<div id="status">Daten werden geladen …</div>

<div id="adminPanel">

  <h2 id="formTitle">Restaurant hinzufügen</h2>

  <div class="formgrid">

    <input id="fName" placeholder="Name *">
    <input id="fOrt" placeholder="Ort">
    <input id="fKategorie" placeholder="Kategorie">
    <input id="fAdresse" placeholder="Adresse">
    <input id="fTelefon" placeholder="Telefon">
    <input id="fWebsite" placeholder="Website">
    <input id="fEmail" placeholder="E-Mail">
    <input id="fOeffnungszeiten" placeholder="Öffnungszeiten">
    <input id="fRuhetag" placeholder="Ruhetag">

    <textarea id="fNotizen" placeholder="Notizen"></textarea>

  </div>

  <div class="formbuttons">
    <button class="save" onclick="savePlace()">Speichern</button>
    <button onclick="cancelEdit()">Abbrechen</button>
  </div>

  <div id="adminMessage"></div>

</div>

<div id="list"></div>

</main>

<script>

/* =========================================================
   ZENTRALE DATENBANK
   ========================================================= */

const DATA_URL =
  "https://tegernsee-restaurants-api.msc4021.workers.dev";


/* =========================================================
   GRUNDEINSTELLUNGEN
   ========================================================= */

let restaurants = [];
let filter = "Alle";
let editingRestaurant = null;

const favorites = new Set(
  JSON.parse(
    localStorage.getItem("tegernseeFavorites") || "[]"
  )
);

const filters = [
  "Alle",
  "Restaurant",
  "Alm",
  "Ausflugsziel",
  "Kreuth",
  "Tegernsee"
];

const list = document.getElementById("list");
const search = document.getElementById("search");


/* =========================================================
   FILTER
   ========================================================= */

document.getElementById("filters").innerHTML =
  filters.map(x =>
    `<button data-filter="${esc(x)}">${esc(x)}</button>`
  ).join("");

document.querySelectorAll("[data-filter]").forEach(button => {

  button.addEventListener("click", () => {

    filter = button.dataset.filter;

    document
      .querySelectorAll("[data-filter]")
      .forEach(x =>
        x.classList.toggle(
          "active",
          x === button
        )
      );

    render();
  });

});

document
  .querySelector('[data-filter="Alle"]')
  .classList.add("active");

search.addEventListener("input", render);


/* =========================================================
   DATEN NORMALISIEREN
   ========================================================= */

function normalizeRestaurant(r){

  return {
    id: r.id ?? null,

    name:
      r.name ??
      "",

    location:
      r.ort ??
      r.location ??
      "",

    category:
      r.kategorie ??
      r.category ??
      "",

    address:
      r.adresse ??
      r.address ??
      "",

    phone:
      r.telefon ??
      r.phone ??
      "",

    website:
      r.website ??
      "",

    email:
      r.email ??
      "",

    openingHours:
      r.oeffnungszeiten ??
      r.openingHours ??
      "",

    closedDay:
      r.ruhetag ??
      r.restDay ??
      "",

    notes:
      r.notizen ??
      r.notes ??
      ""
  };
}


/* =========================================================
   DATENBANK LADEN
   ========================================================= */

async function loadRestaurants(){

  try{

    document.getElementById("status").textContent =
      "Daten werden geladen …";

    const response =
      await fetch(
        DATA_URL + "?v=" + Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }

    const data = await response.json();

    restaurants =
      Array.isArray(data)
        ? data.map(normalizeRestaurant)
        : [];

    restaurants.sort(
      (a,b) =>
        String(a.name).localeCompare(
          String(b.name),
          "de"
        )
    );

    document.getElementById("status").textContent =
      `${restaurants.length} Restaurants · zentrale Datenbank`;

    render();

  }catch(error){

    console.error(error);

    document.getElementById("status").textContent =
      "Die Restaurantdaten konnten nicht geladen werden.";

    list.innerHTML =
      `<div class="empty">
        Die zentrale Restaurantliste konnte gerade nicht geladen werden.
      </div>`;
  }
}


/* =========================================================
   ADMIN-PASSWORT
   ========================================================= */

function getAdminPassword(){

  let password =
    sessionStorage.getItem(
      "tegernseeAdminPassword"
    );

  if(!password){

    password =
      prompt(
        "Bitte dein Admin-Passwort eingeben:"
      );

    if(!password){
      throw new Error(
        "Kein Admin-Passwort eingegeben."
      );
    }

    sessionStorage.setItem(
      "tegernseeAdminPassword",
      password
    );
  }

  return password;
}


/* =========================================================
   API-AUFRUF
   ========================================================= */

async function apiRequest(payload){

  const password =
    getAdminPassword();

  const response =
    await fetch(
      DATA_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json",

          "Authorization":
            "Bearer " + password
        },

        body:
          JSON.stringify(payload)
      }
    );

  if(response.status === 401){

    sessionStorage.removeItem(
      "tegernseeAdminPassword"
    );

    throw new Error(
      "Das Admin-Passwort ist falsch."
    );
  }

  if(!response.ok){

    const text =
      await response.text();

    throw new Error(
      text ||
      "Serverfehler " +
      response.status
    );
  }

  return response.json();
}


/* =========================================================
   DARSTELLUNG
   ========================================================= */

function render(){

  const q =
    search.value
      .toLowerCase()
      .trim();

  let data =
    restaurants.filter(r => {

      const filterOK =
        filter === "Alle" ||
        r.category === filter ||
        r.location === filter;

      const searchOK =
        !q ||
        (
          r.name + " " +
          r.location + " " +
          r.category + " " +
          r.address
        )
        .toLowerCase()
        .includes(q);

      return filterOK && searchOK;
    });


  data.sort((a,b) => {

    const af =
      favorites.has(keyFor(a));

    const bf =
      favorites.has(keyFor(b));

    if(af !== bf)
      return bf - af;

    return String(a.name)
      .localeCompare(
        String(b.name),
        "de"
      );
  });


  if(!data.length){

    list.innerHTML =
      `<div class="empty">
        Keine Treffer.
      </div>`;

    return;
  }


  list.innerHTML =
    data.map(renderCard).join("");
}


/* =========================================================
   RESTAURANT-KARTE
   ========================================================= */

function renderCard(r){

  const key =
    keyFor(r);

  const favorite =
    favorites.has(key);

  const status =
    openingStatus(r);

  const mapQuery =
    r.name + " " +
    r.address + " " +
    r.location;

  const mapURL =
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(mapQuery);


  return `
    <div class="card">

      <div class="cardhead">

        <div style="flex:1">

          <div class="name">
            ${esc(r.name)}
          </div>

          <div class="meta">
            ${esc(r.category || "")}
            ${r.category && r.location ? " · " : ""}
            ${esc(r.location || "")}
          </div>

        </div>

        <button
          class="favorite ${favorite ? "on" : ""}"
          onclick='toggleFavorite(${JSON.stringify(key)})'
          aria-label="Favorit">

          ${favorite ? "★" : "☆"}

        </button>

      </div>


      <div class="statusline">
        <span class="${status.cls}">
          ● ${esc(status.text)}
        </span>
      </div>


      <div class="details">

        ${
          r.address
            ? `<div class="detailrow">
                📍 <b>Adresse:</b>
                ${esc(r.address)}
              </div>`
            : ""
        }

        ${
          r.phone
            ? `<div class="detailrow">
                ☎️ <b>Telefon:</b>
                <a href="tel:${escAttr(r.phone)}">
                  ${esc(r.phone)}
                </a>
              </div>`
            : ""
        }

        ${
          r.email
            ? `<div class="detailrow">
                ✉️ <b>E-Mail:</b>
                <a href="mailto:${escAttr(r.email)}">
                  ${esc(r.email)}
                </a>
              </div>`
            : ""
        }

        ${
          r.openingHours
            ? `<div class="detailrow">
                🕐 <b>Öffnungszeiten:</b>
                ${esc(r.openingHours)}
              </div>`
            : ""
        }

        ${
          r.closedDay
            ? `<div class="detailrow">
                🚫 <b>Ruhetag:</b>
                ${esc(r.closedDay)}
              </div>`
            : ""
        }

      </div>


      ${
        r.notes
          ? `<div class="updated">
              ${esc(r.notes)}
            </div>`
          : ""
      }


      <div class="actions">

        <a
          href="${mapURL}"
          target="_blank"
          rel="noopener">
          📍 Route
        </a>


        ${
          r.website
            ? `<a
                href="${safeURL(r.website)}"
                target="_blank"
                rel="noopener">
                🌐 Website
              </a>`
            : ""
        }


        ${
          r.phone
            ? `<a
                href="tel:${escAttr(r.phone)}">
                ☎️ Anrufen
              </a>`
            : ""
        }


        <button
          class="admin"
          onclick="editRestaurant(${r.id})">
          ✏️ Ändern
        </button>


        <button
          class="delete"
          onclick="deleteRestaurant(${r.id})">
          🗑️ Löschen
        </button>

      </div>

    </div>
  `;
}


/* =========================================================
   FAVORITEN
   ========================================================= */

function keyFor(r){

  return String(
    r.id ??
    r.name ??
    ""
  )
  .trim()
  .toLowerCase();
}


function toggleFavorite(key){

  if(favorites.has(key)){

    favorites.delete(key);

  }else{

    favorites.add(key);

  }

  localStorage.setItem(
    "tegernseeFavorites",
    JSON.stringify(
      [...favorites]
    )
  );

  render();
}


/* =========================================================
   RESTAURANT HINZUFÜGEN
   ========================================================= */

async function addRestaurant(){

  editingRestaurant = null;

  clearForm();

  document.getElementById(
    "formTitle"
  ).textContent =
    "Restaurant hinzufügen";

  document.getElementById(
    "adminPanel"
  ).style.display =
    "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================================================
   RESTAURANT ÄNDERN
   ========================================================= */

function editRestaurant(id){

  const restaurant =
    restaurants.find(
      r => Number(r.id) === Number(id)
    );

  if(!restaurant){

    alert(
      "Restaurant nicht gefunden."
    );

    return;
  }

  editingRestaurant =
    restaurant;

  document.getElementById(
    "formTitle"
  ).textContent =
    "Restaurant ändern";


  document.getElementById("fName").value =
    restaurant.name || "";

  document.getElementById("fOrt").value =
    restaurant.location || "";

  document.getElementById("fKategorie").value =
    restaurant.category || "";

  document.getElementById("fAdresse").value =
    restaurant.address || "";

  document.getElementById("fTelefon").value =
    restaurant.phone || "";

  document.getElementById("fWebsite").value =
    restaurant.website || "";

  document.getElementById("fEmail").value =
    restaurant.email || "";

  document.getElementById("fOeffnungszeiten").value =
    restaurant.openingHours || "";

  document.getElementById("fRuhetag").value =
    restaurant.closedDay || "";

  document.getElementById("fNotizen").value =
    restaurant.notes || "";

  document.getElementById(
    "adminPanel"
  ).style.display =
    "block";

  document.getElementById(
    "adminMessage"
  ).textContent =
    "";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================================================
   FORMULAR SPEICHERN
   ========================================================= */

async function savePlace(){

  const name =
    document.getElementById(
      "fName"
    ).value.trim();

  if(!name){

    alert(
      "Bitte mindestens den Namen eingeben."
    );

    return;
  }


  const restaurant = {

    name:name,

    ort:
      document.getElementById(
        "fOrt"
      ).value.trim(),

    kategorie:
      document.getElementById(
        "fKategorie"
      ).value.trim(),

    adresse:
      document.getElementById(
        "fAdresse"
      ).value.trim(),

    telefon:
      document.getElementById(
        "fTelefon"
      ).value.trim(),

    website:
      document.getElementById(
        "fWebsite"
      ).value.trim(),

    email:
      document.getElementById(
        "fEmail"
      ).value.trim(),

    oeffnungszeiten:
      document.getElementById(
        "fOeffnungszeiten"
      ).value.trim(),

    ruhetag:
      document.getElementById(
        "fRuhetag"
      ).value.trim(),

    notizen:
      document.getElementById(
        "fNotizen"
      ).value.trim()
  };


  const message =
    document.getElementById(
      "adminMessage"
    );


  try{

    message.textContent =
      "Wird gespeichert …";


    if(editingRestaurant){

      await apiRequest({

        action:"update",

        id:
          editingRestaurant.id,

        restaurant:
          restaurant
      });

    }else{

      await apiRequest({

        action:"create",

        restaurant:
          restaurant
      });

    }


    message.textContent =
      "Gespeichert ✓";


    await loadRestaurants();

    clearForm();

    editingRestaurant =
      null;

    document.getElementById(
      "adminPanel"
    ).style.display =
      "none";


  }catch(error){

    console.error(error);

    message.textContent =
      error.message ||
      "Speichern fehlgeschlagen.";
  }
}


/* =========================================================
   RESTAURANT LÖSCHEN
   ========================================================= */

async function deleteRestaurant(id){

  const restaurant =
    restaurants.find(
      r => Number(r.id) === Number(id)
    );

  if(!restaurant)
    return;


  const ok =
    confirm(
      `Soll "${restaurant.name}" wirklich gelöscht werden?`
    );

  if(!ok)
    return;


  try{

    await apiRequest({

      action:"delete",

      id:
        restaurant.id
    });


    await loadRestaurants();


  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "Löschen fehlgeschlagen."
    );
  }
}


/* =========================================================
   FORMULAR ZURÜCKSETZEN
   ========================================================= */

function clearForm(){

  [
    "fName",
    "fOrt",
    "fKategorie",
    "fAdresse",
    "fTelefon",
    "fWebsite",
    "fEmail",
    "fOeffnungszeiten",
    "fRuhetag",
    "fNotizen"
  ].forEach(id => {

    document.getElementById(
      id
    ).value = "";

  });

  document.getElementById(
    "adminMessage"
  ).textContent =
    "";
}


function cancelEdit(){

  editingRestaurant =
    null;

  clearForm();

  document.getElementById(
    "adminPanel"
  ).style.display =
    "none";
}


/* =========================================================
   ÖFFNUNGSSTATUS
   ========================================================= */

function openingStatus(r){

  const hours =
    String(
      r.openingHours || ""
    ).trim();

  const closed =
    String(
      r.closedDay || ""
    ).toLowerCase();


  if(!hours){

    return {
      text:"Öffnungszeiten nicht hinterlegt",
      cls:"unknown"
    };
  }


  const today =
    [
      "sonntag",
      "montag",
      "dienstag",
      "mittwoch",
      "donnerstag",
      "freitag",
      "samstag"
    ][new Date().getDay()];


  if(
    closed &&
    (
      closed.includes(today) ||
      (
        today === "montag" &&
        (closed.includes("mo") ||
         closed.includes("montag"))
      )
    )
  ){

    return {
      text:"Geschlossen heute",
      cls:"closed"
    };
  }


  const ranges =
    hours.match(
      /\d{1,2}[:.]\d{2}\s*[–-]\s*\d{1,2}[:.]\d{2}/g
    );


  if(!ranges){

    return {
      text:hours,
      cls:"unknown"
    };
  }


  const now =
    new Date();

  const minutes =
    now.getHours()*60 +
    now.getMinutes();


  for(
    const range of ranges
  ){

    const parts =
      range.match(
        /(\d{1,2})[:.](\d{2})\s*[–-]\s*(\d{1,2})[:.](\d{2})/
      );

    if(!parts)
      continue;


    const from =
      Number(parts[1])*60 +
      Number(parts[2]);

    const to =
      Number(parts[3])*60 +
      Number(parts[4]);


    if(
      minutes >= from &&
      minutes <= to
    ){

      return {
        text:"Jetzt geöffnet",
        cls:"open"
      };
    }
  }


  return {
    text:"Jetzt geschlossen",
    cls:"closed"
  };
}


/* =========================================================
   HILFSFUNKTIONEN
   ========================================================= */

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char])
  );
}


function escAttr(value){

  return esc(value);
}


function safeURL(url){

  let u =
    String(url || "").trim();

  if(!u)
    return "#";

  if(
    !/^https?:\/\//i.test(u)
  ){

    u =
      "https://" + u;
  }

  return escAttr(u);
}


/* =========================================================
   START
   ========================================================= */

loadRestaurants();

</script>

</body>
</html>
