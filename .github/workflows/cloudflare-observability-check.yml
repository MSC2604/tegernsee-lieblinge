name: Check Cloudflare Worker Observability

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-observability-check.yml"
  workflow_run:
    workflows: ["Deploy Cloudflare Worker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    # Verify the 06:00 Europe/Berlin run after either UTC trigger.
    - cron: "45 6 * * *"

jobs:
  check-observability:
    runs-on: ubuntu-latest
    steps:
      - name: Require the production Worker deployment to succeed
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "::error::The Cloudflare Worker deployment did not succeed."
            exit 1
          fi
          echo "Cloudflare Worker deployment completed successfully."
      - name: Read the actual Cloudflare Cron schedule (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare API token or account ID is missing in GitHub Actions secrets."
            exit 1
          fi
          RESPONSE=$(mktemp)
          STATUS=$(curl --silent --show-error --output "$RESPONSE" --write-out "%{http_code}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/tegernsee-restaurants-api/schedules" --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "Cloudflare Cron schedules API HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            jq -r '.errors[]?.message // "No API error details returned."' "$RESPONSE" || true
            exit 1
          fi
          echo "Cron schedule(s) actually stored in Cloudflare:"
          jq -r '.result.schedules[]?.cron // empty' "$RESPONSE"
          if ! jq -e '.result.schedules | length == 2 and (map(.cron) | sort) == (["0-39 4 * * *", "0-39 5 * * *"] | sort)' "$RESPONSE" >/dev/null; then
            echo "::error::Cloudflare Cron must contain exactly the two UTC windows used by the Europe/Berlin 06:00-06:39 shard guard."
            exit 1
          fi
          echo "Verified: both UTC windows for the 30-shard 06:00-06:29 Europe/Berlin run are configured."
      - name: Verify that the Brevo API secret exists in the production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(mktemp)
          STATUS=$(curl --silent --show-error --output "$RESPONSE" --write-out "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/tegernsee-restaurants-api/secrets" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "Cloudflare Worker secrets API HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]] || ! jq -e '.success == true' "$RESPONSE" >/dev/null; then
            jq -r '.errors[]?.message // "Cloudflare did not return a successful secret-list response."' "$RESPONSE" || true
            exit 1
          fi
          if ! jq -e 'any(.result[]?; .name == "BREVO_API_KEY")' "$RESPONSE" >/dev/null; then
            echo "::error::BREVO_API_KEY is not present as a production Worker secret."
            exit 1
          fi
          echo "Verified: BREVO_API_KEY exists in the production Worker; its value is never read or displayed."
      - name: Create a harmless Worker request to test log ingestion
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            "https://tegernsee-restaurants-api.msc4021.workers.dev/?action=paymentResearchStatus")
          echo "Read-only Worker health request HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            echo "::error::The read-only Worker health request failed."
            exit 1
          fi
          echo "The request only reads the payment research status; it does not change restaurant data."
          sleep 15

      - name: Discover available telemetry fields
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          KEYS_RESPONSE=$(mktemp)
          STATUS=$(curl --silent --show-error --output "$KEYS_RESPONSE" --write-out "%{http_code}" \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/keys" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"datasets":["cloudflare-workers"]}')
          echo "Telemetry keys API HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            jq -r '.errors[]?.message // "No API error details returned."' "$KEYS_RESPONSE" || true
            exit 1
          fi
          jq -r '"Telemetry fields discovered: " + ((.result // []) | length | tostring), "Last seen for service field: " + (([.result[]? | select(.key == "$metadata.service")][0].lastSeenAt // 0) | tostring), ((.result // [])[]?.key // empty)' "$KEYS_RESPONSE"


      - name: Verify the Worker service name exists in telemetry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          NOW_MS=$(date +%s000)
          FROM_MS=$((NOW_MS - 86400000))
          VALUES_BODY=$(jq -n --argjson from "$FROM_MS" --argjson to "$NOW_MS" '{
            datasets: ["cloudflare-workers"],
            key: "$metadata.service",
            timeframe: {from: $from, to: $to},
            type: "string"
          }')
          VALUES_RESPONSE=$(mktemp)
          STATUS=$(curl --silent --show-error --output "$VALUES_RESPONSE" --write-out "%{http_code}" \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/values" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$VALUES_BODY")
          echo "Telemetry service-values API HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            jq -r '.errors[]?.message // "No API error details returned."' "$VALUES_RESPONSE" || true
            exit 1
          fi
          jq -r '"Services found in the last 24 hours: " + ((.result // []) | length | tostring),
            "Tegernsee Worker service found: " + (if any(.result[]?; .value == "tegernsee-restaurants-api") then "yes" else "no" end)' "$VALUES_RESPONSE"

      - name: Query recent Worker telemetry through the existing Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare API token or account ID is missing in GitHub Actions secrets."
            exit 1
          fi

          NOW_MS=$(date +%s000)
          FROM_MS=$((NOW_MS - 86400000))
          COUNT_BODY=$(jq -n --argjson from "$FROM_MS" --argjson to "$NOW_MS" '{
            queryId: "restaurant-worker-observability-count-v1",
            timeframe: {from: $from, to: $to},
            dry: false,
            view: "calculations",
            parameters: {
              datasets: ["cloudflare-workers"],
              filters: [{
                key: "$metadata.service",
                operation: "eq",
                type: "string",
                value: "tegernsee-restaurants-api"
              }],
              calculations: [{operator: "count", alias: "events_total"}],
              groupBys: [{type: "string", value: "$workers.eventType"}]
            }
          }')
          COUNT_RESPONSE=$(mktemp)
          COUNT_STATUS=$(curl --silent --show-error --output "$COUNT_RESPONSE" --write-out "%{http_code}" \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$COUNT_BODY")
          echo "Telemetry aggregate-count API HTTP status: $COUNT_STATUS"
          if [[ "$COUNT_STATUS" != "200" ]]; then
            jq -r '.errors[]?.message // "No API error details returned."' "$COUNT_RESPONSE" || true
            exit 1
          fi
          jq -r '"Aggregate calculations returned: " + ((.result.calculations // []) | length | tostring),
            ((.result.calculations // [])[]? | "Calculation: " + (.calculation // "unknown"),
              ((.aggregates // [])[]? | "Event type groups: " + ((.groups // []) | map(.value // "unknown" | tostring) | join(", ")) +
                "; count: " + (.value // 0 | tostring)))' "$COUNT_RESPONSE"

          echo "Cloudflare Observability API access confirmed."

      - name: Diagnose scheduled Worker invocation messages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          NOW_MS=$(date +%s000)
          FROM_MS=$((NOW_MS - 21600000))
          BODY=$(jq -n --argjson from "$FROM_MS" --argjson to "$NOW_MS" '{
            queryId: "restaurant-worker-scheduled-diagnostic-v1",
            timeframe: {from: $from, to: $to},
            dry: false,
            view: "events",
            limit: 100,
            parameters: {
              datasets: ["cloudflare-workers"],
              filters: [
                {key: "$metadata.service", operation: "eq", type: "string", value: "tegernsee-restaurants-api"},
                {key: "$workers.eventType", operation: "eq", type: "string", value: "scheduled"}
              ]
            }
          }')
          RESPONSE=$(mktemp)
          STATUS=$(curl --silent --show-error --output "$RESPONSE" --write-out "%{http_code}" \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$BODY")
          echo "Scheduled invocation diagnostic API HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            jq -r '.errors[]?.message // "No API error details returned."' "$RESPONSE" || true
            exit 1
          fi
          echo "Cloudflare telemetry result structure:"
          jq -c '[.result.events.events[]? | {
            timestamp, type: .["$metadata"].type, level: .["$metadata"].level,
            message: .["$metadata"].message, error: .["$metadata"].error,
            sourceMessage: .source.message, eventType: .["$workers"].eventType,
            outcome: .["$workers"].outcome, cron: .["$workers"].event.cron
          }]' "$RESPONSE"
      - name: Inspect the latest scheduled website-monitor summary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          NOW_MS=$(date +%s000)
          FROM_MS=$((NOW_MS - 14400000))
          EVENTS_BODY=$(jq -n --argjson from "$FROM_MS" --argjson to "$NOW_MS" '{
            queryId: "restaurant-website-monitor-scheduled-events-v1",
            timeframe: {from: $from, to: $to},
            dry: false,
            view: "events",
            limit: 100,
            parameters: {
              datasets: ["cloudflare-workers"],
              filters: [
                {key: "$metadata.service", operation: "eq", type: "string", value: "tegernsee-restaurants-api"},
                {key: "$metadata.type", operation: "eq", type: "string", value: "cf-worker"}
              ],
              needle: {value: "Website-Prüfung:", isRegex: false, matchCase: false}
            }
          }')
          EVENTS_RESPONSE=$(mktemp)
          EVENTS_STATUS=$(curl --silent --show-error --output "$EVENTS_RESPONSE" --write-out "%{http_code}" \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$EVENTS_BODY")
          echo "Scheduled monitor-events API HTTP status: $EVENTS_STATUS"
          if [[ "$EVENTS_STATUS" != "200" ]]; then
            jq -r '.errors[]?.message // "No API error details returned."' "$EVENTS_RESPONSE" || true
            exit 1
          fi
          LATEST_MESSAGE=$(jq -r '
            [.result.events.events[]?
             | {timestamp: (.timestamp // .["$metadata"].endTime // 0),
                message: (.["$metadata"].message // .source.message // .message // "")}
             | select(.message | contains("Website-Prüfung:"))]
            | sort_by(.timestamp) | last | .message // ""
          ' "$EVENTS_RESPONSE")
          if [[ -z "$LATEST_MESSAGE" ]]; then
            echo "No website-monitor log summary found in the last four hours; baseline is not verified yet."
            exit 0
          fi
          SUMMARY_JSON="${LATEST_MESSAGE#*Website-Prüfung: }"
          echo "Latest scheduled website-monitor summary: $SUMMARY_JSON"
          BASELINE_ONLY=$(jq -r '.baselineOnly // false' <<< "$SUMMARY_JSON")
          BASELINE_COMPLETE=$(jq -r '.baselineComplete // false' <<< "$SUMMARY_JSON")
          PROPOSALS=$(jq -r '.proposals // -1' <<< "$SUMMARY_JSON")
          if [[ "$BASELINE_ONLY" == "true" && "$PROPOSALS" != "0" ]]; then
            echo "::error::Proposal-free baseline guarantee was violated."
            exit 1
          fi
          if [[ "$BASELINE_ONLY" == "true" && "$BASELINE_COMPLETE" == "true" ]]; then
            echo "Initial baseline verified: all configured official websites have homepage snapshots and zero proposals were created."
          elif [[ "$BASELINE_ONLY" == "true" ]]; then
            echo "Initial baseline remains proposal-free but incomplete. Homepage snapshots: $(jq -r '.officialHomepageSnapshots // 0' <<< "$SUMMARY_JSON") / $(jq -r '.officialWebsiteCount // 0' <<< "$SUMMARY_JSON")."
          elif [[ "$BASELINE_COMPLETE" == "true" ]]; then
            echo "All configured official websites already have homepage snapshots; this run was not in baseline-only mode."
          else
            echo "Baseline coverage is not yet complete."
          fi

      - name: Verify that the daily report was accepted by Brevo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          NOW_MS=$(date +%s000)
          FROM_MS=$((NOW_MS - 14400000))
          EMAIL_BODY=$(jq -n --argjson from "$FROM_MS" --argjson to "$NOW_MS" '{
            queryId: "restaurant-website-monitor-email-v1",
            timeframe: {from: $from, to: $to},
            dry: false,
            view: "events",
            limit: 100,
            parameters: {
              datasets: ["cloudflare-workers"],
              filters: [
                {key: "$metadata.service", operation: "eq", type: "string", value: "tegernsee-restaurants-api"},
                {key: "$metadata.type", operation: "eq", type: "string", value: "cf-worker"}
              ],
              needle: {value: "Restaurant-Prüfbericht:", isRegex: false, matchCase: false}
            }
          }')
          EMAIL_RESPONSE=$(mktemp)
          STATUS=$(curl --silent --show-error --output "$EMAIL_RESPONSE" --write-out "%{http_code}" \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$EMAIL_BODY")
          echo "Scheduled email-report telemetry API HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            jq -r '.errors[]?.message // "No API error details returned."' "$EMAIL_RESPONSE" || true
            exit 1
          fi
          LATEST_EMAIL=$(jq -r '
            [.result.events.events[]?
             | {timestamp: (.timestamp // .["$metadata"].endTime // 0),
                message: (.["$metadata"].message // .source.message // .message // "")}
             | select(.message | contains("Restaurant-Prüfbericht:"))]
            | sort_by(.timestamp) | last | .message // ""
          ' "$EMAIL_RESPONSE")
          if [[ -z "$LATEST_EMAIL" ]]; then
            echo "::error::No restaurant email-report log result found in the last four hours."
            exit 1
          fi
          EMAIL_JSON="${LATEST_EMAIL#*Restaurant-Prüfbericht: }"
          echo "Latest scheduled email result: $EMAIL_JSON"
          if ! jq -e '.sent == true and .acceptedByProvider == true' <<< "$EMAIL_JSON" >/dev/null; then
            echo "::error::The scheduled restaurant report was not confirmed as accepted by Brevo."
            exit 1
          fi
          echo "Verified: Brevo accepted the scheduled daily restaurant report."
