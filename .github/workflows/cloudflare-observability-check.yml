name: Check Cloudflare Worker Observability

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cloudflare-observability-check.yml"
      - "wrangler.toml"
  workflow_dispatch:

jobs:
  check-observability:
    runs-on: ubuntu-latest
    steps:
      - name: Create a harmless Worker request to test log ingestion
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            "https://tegernsee-restaurants-api.msc4021.workers.dev/?action=paymentResearchStatus")
          echo "Read-only Worker health request HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            echo "::error::The read-only Worker health request failed."
            exit 1
          fi
          echo "The request only reads the payment research status; it does not change restaurant data."
          sleep 15

      - name: Discover available telemetry fields
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          KEYS_RESPONSE=$(mktemp)
          STATUS=$(curl --silent --show-error --output "$KEYS_RESPONSE" --write-out "%{http_code}" \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/keys" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"datasets":["cloudflare-workers"]}')
          echo "Telemetry keys API HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            jq -r '.errors[]?.message // "No API error details returned."' "$KEYS_RESPONSE" || true
            exit 1
          fi
          jq -r '"Telemetry fields discovered: " + ((.result // []) | length | tostring), ((.result // [])[]?.key // empty)' "$KEYS_RESPONSE"


      - name: Query recent Worker telemetry through the existing Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare API token or account ID is missing in GitHub Actions secrets."
            exit 1
          fi

          NOW_MS=$(date +%s000)
          FROM_MS=$((NOW_MS - 1800000))
          BODY=$(jq -n \
            --argjson from "$FROM_MS" \
            --argjson to "$NOW_MS" \
            '{
              queryId: "restaurant-worker-observability-live-diagnostic",
              timeframe: {from: $from, to: $to},
              dry: true,
              limit: 2000,
              parameters: {
                datasets: ["cloudflare-workers"],
                view: "events"
              }
            }')

          RESPONSE=$(mktemp)
          STATUS=$(curl --silent --show-error \
            --output "$RESPONSE" \
            --write-out "%{http_code}" \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$BODY")

          echo "Cloudflare Observability API HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            jq -r '.errors[]?.message // .messages[]?.message // "No API error details returned."' "$RESPONSE" || true
            echo "::error::Cloudflare Observability query failed."
            exit 1
          fi

          jq -r '
            "Query status: " + (.result.run.status // "unknown"),
            "All events returned in the last 30 minutes: " + ((.result.events.events // []) | length | tostring),
            "Events attributed to tegernsee-restaurants-api: " +
              (([.result.events.events[]? |
                select(
                  (.["$metadata"].service // "") == "tegernsee-restaurants-api" or
                  (.["$workers"].scriptName // "") == "tegernsee-restaurants-api"
                )] | length) | tostring),
            (([.result.events.events[]? |
              select(
                (.["$metadata"].service // "") == "tegernsee-restaurants-api" or
                (.["$workers"].scriptName // "") == "tegernsee-restaurants-api"
              )] |
              group_by(.["$workers"].eventType // "unknown")[] |
              "Worker event type " + (.[0]["$workers"].eventType // "unknown") +
              ": " + (length | tostring)
            ))
          ' "$RESPONSE"

          echo "Cloudflare Observability API access confirmed."
