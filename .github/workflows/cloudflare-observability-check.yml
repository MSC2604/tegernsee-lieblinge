name: Check Cloudflare Worker Observability

on:
  workflow_run:
    workflows: ["Deploy Cloudflare Worker"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/cloudflare-observability-check.yml
  workflow_dispatch:
  schedule:
    # Verify the completed 40-minute local shard window after both seasonal UTC schedules.
    - cron: "5 8 * * *"
    # Second verification window in case GitHub delays or misses the first scheduled run.
    - cron: "35 8 * * *"

# Keep duplicate deployment/schedule checks from generating a notification storm.
concurrency:
  group: cloudflare-observability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-observability:
    runs-on: ubuntu-latest
    steps:
      - name: Require the production Worker deployment to succeed
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "::error::The Cloudflare Worker deployment did not succeed."
            exit 1
          fi
          echo "Cloudflare Worker deployment completed successfully."
      - name: Read the actual Cloudflare Cron schedule (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare API token or account ID is missing in GitHub Actions secrets."
            exit 1
          fi
          RESPONSE=$(mktemp)
          STATUS=$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 45 --output "$RESPONSE" --write-out "%{http_code}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/tegernsee-restaurants-api/schedules" --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "Cloudflare Cron schedules API HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            jq -r '.errors[]?.message // "No API error details returned."' "$RESPONSE" || true
            exit 1
          fi
          echo "Cron schedule(s) actually stored in Cloudflare:"
          jq -r '.result.schedules[]?.cron // empty' "$RESPONSE"
          if ! jq -e '.result.schedules | length == 2 and (map(.cron) | sort) == (["0-39 4 * * *", "0-39 5 * * *"] | sort)' "$RESPONSE" >/dev/null; then
            echo "::error::Cloudflare Cron must contain exactly 0-39 4 * * * and 0-39 5 * * *."
            exit 1
          fi
          echo "Verified: Cloudflare stores the exact two seasonal UTC triggers for 40 Berlin slots."
      - name: Verify that the Brevo API secret exists in the production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(mktemp)
          STATUS=$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 45 --output "$RESPONSE" --write-out "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/tegernsee-restaurants-api/secrets" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "Cloudflare Worker secrets API HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]] || ! jq -e '.success == true' "$RESPONSE" >/dev/null; then
            jq -r '.errors[]?.message // "Cloudflare did not return a successful secret-list response."' "$RESPONSE" || true
            exit 1
          fi
          if ! jq -e 'any(.result[]?; .name == "BREVO_API_KEY")' "$RESPONSE" >/dev/null; then
            echo "::error::BREVO_API_KEY is not present as a production Worker secret."
            exit 1
          fi
          echo "Verified: BREVO_API_KEY exists in the production Worker; its value is never read or displayed."
      - name: Verify the live Restaurant-App menu item
        shell: bash
        run: |
          set -euo pipefail
          APP_HTML=$(mktemp)
          STATUS=$(curl --silent --show-error --retry 5 --retry-delay 2 --output "$APP_HTML" --write-out "%{http_code}" \
            "https://msc2604.github.io/tegernsee-lieblinge/")
          echo "GitHub Pages live app HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]] || ! grep -Fq "Änderungen auf Restaurant-Webseiten" "$APP_HTML"; then
            echo "::error::The live app does not yet expose the website-change monitoring menu item."
            exit 1
          fi
          echo "Verified: the live app contains the admin menu item."

      - name: Verify live Worker and read-only Turso health
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_RESPONSE=$(mktemp)
          STATUS=$(curl --silent --show-error --retry 3 --retry-delay 2 --output "$HEALTH_RESPONSE" --write-out "%{http_code}" \
            "https://tegernsee-restaurants-api.msc4021.workers.dev/health")
          echo "Read-only Worker health HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]] || ! jq -e '.ok == true and .service == "tegernsee-restaurants-api" and .database == "ok"' "$HEALTH_RESPONSE" >/dev/null; then
            jq -c . "$HEALTH_RESPONSE" || true
            echo "::error::The live Worker or its read-only Turso health check failed."
            exit 1
          fi
          echo "Verified: production Worker is active and Turso answers SELECT 1."
          sleep 15

      - name: Discover available telemetry fields
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          KEYS_RESPONSE=$(mktemp)
          STATUS=$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 45 --output "$KEYS_RESPONSE" --write-out "%{http_code}" \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/keys" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"datasets":["cloudflare-workers"]}')
          echo "Telemetry keys API HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            jq -r '.errors[]?.message // "No API error details returned."' "$KEYS_RESPONSE" || true
            exit 1
          fi
          jq -r '"Telemetry fields discovered: " + ((.result // []) | length | tostring), "Last seen for service field: " + (([.result[]? | select(.key == "$metadata.service")][0].lastSeenAt // 0) | tostring), ((.result // [])[]?.key // empty)' "$KEYS_RESPONSE"


      - name: Verify the Worker service name exists in telemetry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          NOW_MS=$(date +%s000)
          FROM_MS=$((NOW_MS - 86400000))
          BODY=$(jq -n --argjson from "$FROM_MS" --argjson to "$NOW_MS" '{
            queryId: "restaurant-worker-service-presence-v1",
            timeframe: {from: $from, to: $to},
            dry: false,
            view: "events",
            limit: 1,
            parameters: {
              datasets: ["cloudflare-workers"],
              filters: [{key: "$metadata.service", operation: "eq", type: "string", value: "tegernsee-restaurants-api"}]
            }
          }')
          RESPONSE=$(mktemp)
          STATUS=$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 45 --output "$RESPONSE" --write-out "%{http_code}" \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$BODY")
          echo "Telemetry service-presence API HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            jq -r '.errors[]?.message // "No API error details returned."' "$RESPONSE" || true
            exit 1
          fi
          EVENT_COUNT=$(jq -r '.result.events.events | length' "$RESPONSE")
          echo "Worker telemetry events found in the last 24 hours: $EVENT_COUNT"
          if [[ "$EVENT_COUNT" -lt 1 ]]; then
            echo "::error::No telemetry events were found for the production Worker in the last 24 hours."
            exit 1
          fi
          echo "Verified: the production Worker is present in Cloudflare telemetry."

      - name: Query recent Worker telemetry through the existing Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare API token or account ID is missing in GitHub Actions secrets."
            exit 1
          fi

          NOW_MS=$(date +%s000)
          FROM_MS=$((NOW_MS - 86400000))
          COUNT_BODY=$(jq -n --argjson from "$FROM_MS" --argjson to "$NOW_MS" '{
            queryId: "restaurant-worker-observability-count-v1",
            timeframe: {from: $from, to: $to},
            dry: false,
            view: "calculations",
            parameters: {
              datasets: ["cloudflare-workers"],
              filters: [{
                key: "$metadata.service",
                operation: "eq",
                type: "string",
                value: "tegernsee-restaurants-api"
              }],
              calculations: [{operator: "count", alias: "events_total"}],
              groupBys: [{type: "string", value: "$workers.eventType"}]
            }
          }')
          COUNT_RESPONSE=$(mktemp)
          COUNT_STATUS=$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 45 --output "$COUNT_RESPONSE" --write-out "%{http_code}" \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$COUNT_BODY")
          echo "Telemetry aggregate-count API HTTP status: $COUNT_STATUS"
          if [[ "$COUNT_STATUS" != "200" ]]; then
            jq -r '.errors[]?.message // "No API error details returned."' "$COUNT_RESPONSE" || true
            exit 1
          fi
          jq -r '"Aggregate calculations returned: " + ((.result.calculations // []) | length | tostring),
            ((.result.calculations // [])[]? | "Calculation: " + (.calculation // "unknown"),
              ((.aggregates // [])[]? | "Event type groups: " + ((.groups // []) | map(.value // "unknown" | tostring) | join(", ")) +
                "; count: " + (.value // 0 | tostring)))' "$COUNT_RESPONSE"

          echo "Cloudflare Observability API access confirmed."

      - name: Diagnose scheduled Worker invocation messages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          NOW_MS=$(date +%s000)
          # Include the complete 06:00-06:39 Europe/Berlin shard window, not only the last six hours.
          FROM_MS=$((NOW_MS - 86400000))
          BODY=$(jq -n --argjson from "$FROM_MS" --argjson to "$NOW_MS" '{
            queryId: "restaurant-worker-scheduled-diagnostic-v1",
            timeframe: {from: $from, to: $to},
            dry: false,
            view: "events",
            limit: 100,
            parameters: {
              datasets: ["cloudflare-workers"],
              filters: [
                {key: "$metadata.service", operation: "eq", type: "string", value: "tegernsee-restaurants-api"},
                {key: "$workers.eventType", operation: "eq", type: "string", value: "scheduled"}
              ],
              needle: {value: "Website-Prüfung:", isRegex: false, matchCase: false}
            }
          }')
          RESPONSE=$(mktemp)
          STATUS=$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 45 --output "$RESPONSE" --write-out "%{http_code}" \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$BODY")
          echo "Scheduled invocation diagnostic API HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            jq -r '.errors[]?.message // "No API error details returned."' "$RESPONSE" || true
            exit 1
          fi
          echo "Cloudflare telemetry result structure:"
          jq -c '[.result.events.events[]? | {
            timestamp, type: .["$metadata"].type, level: .["$metadata"].level,
            message: .["$metadata"].message, error: .["$metadata"].error,
            sourceMessage: .source.message, eventType: .["$workers"].eventType,
            outcome: .["$workers"].outcome, cron: .["$workers"].event.cron,
            scriptVersion: .["$workers"].scriptVersion.id
          }]' "$RESPONSE"
          SCHEDULED_EXCEPTIONS=$(jq '[.result.events.events[]? | select(.["$workers"].outcome == "exception")] | length' "$RESPONSE")
          echo "Scheduled invocation exceptions visible in this telemetry query: $SCHEDULED_EXCEPTIONS"
          echo "A transient invocation exception is not treated as a final daily failure by itself. The checks below require exactly 40 distinct saved sections, a complete baseline summary and Brevo acceptance."
      - name: Enable daily audit after the 06:00–06:39 Europe/Berlin window
        id: daily_audit_gate
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_HHMM=$(TZ=Europe/Berlin date +%H%M)
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" && "$LOCAL_HHMM" < "0645" ]]; then
            echo "run_daily_audit=false" >> "$GITHUB_OUTPUT"
            echo "Daily audit deferred; the local shard window has not finished yet ($LOCAL_HHMM)."
          else
            echo "run_daily_audit=true" >> "$GITHUB_OUTPUT"
            echo "Daily audit enabled for $GITHUB_EVENT_NAME at Europe/Berlin $LOCAL_HHMM."
          fi

      - name: Verify exactly 40 distinct saved section logs for today
        if: steps.daily_audit_gate.outputs.run_daily_audit == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_RUN_DATE=$(TZ=Europe/Berlin date +%F)
          NOW_MS=$(date +%s000)
          FROM_MS=$(TZ=Europe/Berlin date -d "$EXPECTED_RUN_DATE 00:00:00" +%s000)
          BODY=$(jq -n --argjson from "$FROM_MS" --argjson to "$NOW_MS" '{
            queryId: "restaurant-monitor-40-shard-log-audit-v2",
            timeframe: {from: $from, to: $to},
            dry: false,
            view: "events",
            limit: 100,
            parameters: {
              datasets: ["cloudflare-workers"],
              filters: [{key: "$metadata.service", operation: "eq", type: "string", value: "tegernsee-restaurants-api"}],
              needle: {value: "gespeichert:", isRegex: false, matchCase: false}
            }
          }')
          RESPONSE=$(mktemp)
          STATUS=$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 45 --output "$RESPONSE" --write-out "%{http_code}" \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$BODY")
          echo "Saved-shard telemetry API HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            jq -r '.errors[]?.message // "No API error details returned."' "$RESPONSE" || true
            exit 1
          fi
          SHARD_AUDIT=$(jq -c --arg runDate "$EXPECTED_RUN_DATE" '
            [.result.events.events[]?
             | {message: (.[ "$metadata"].message // .source.message // .message // "")}
             | select(.message | contains("Restaurant-Prüfabschnitt gespeichert:"))
             | .message as $message
             | (try ($message | split("Restaurant-Prüfabschnitt gespeichert: ") | last | fromjson) catch null) as $payload
             | select($payload != null and $payload.runDate == $runDate)
             | {shard: $payload.shard, totalShards: $payload.totalShards}]
            | sort_by(.shard)
          ' "$RESPONSE")
          echo "Today's saved shard telemetry: $SHARD_AUDIT"
          if ! jq -e 'length == 40 and (map(.shard) == [range(1; 41)]) and all(.[]; .totalShards == 40)' <<< "$SHARD_AUDIT" >/dev/null; then
            echo "::error::Telemetry does not show exactly one saved log for each of the 40 shard IDs 1 through 40."
            exit 1
          fi
          echo "Verified: exactly 40 distinct saved section logs, with no missing or duplicate section."

      - name: Inspect the latest scheduled website-monitor summary
        id: website_summary
        if: always() && steps.daily_audit_gate.outputs.run_daily_audit == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_RUN_DATE=$(TZ=Europe/Berlin date +%F)
          NOW_MS=$(date +%s000)
          FROM_MS=$(TZ=Europe/Berlin date -d "$EXPECTED_RUN_DATE 00:00:00" +%s000)
          EVENTS_BODY=$(jq -n --argjson from "$FROM_MS" --argjson to "$NOW_MS" '{
            queryId: "restaurant-website-monitor-scheduled-events-v6",
            timeframe: {from: $from, to: $to},
            dry: false,
            view: "events",
            limit: 100,
            parameters: {
              datasets: ["cloudflare-workers"],
              filters: [
                {key: "$metadata.service", operation: "eq", type: "string", value: "tegernsee-restaurants-api"}
              ],
              needle: {value: "baselineComplete", isRegex: false, matchCase: false}
            }
          }')
          EVENTS_RESPONSE=$(mktemp)
          EVENTS_STATUS=$(curl --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 45 --output "$EVENTS_RESPONSE" --write-out "%{http_code}" \
            --request POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$EVENTS_BODY")
          echo "Scheduled monitor-events API HTTP status: $EVENTS_STATUS"
          echo "Monitor summary query window: $EXPECTED_RUN_DATE from=$FROM_MS to=$NOW_MS"
          echo "Scheduled monitor events returned: $(jq -r '.result.events.events | length' "$EVENTS_RESPONSE")"
          if [[ "$EVENTS_STATUS" != "200" ]]; then
            jq -r '.errors[]?.message // "No API error details returned."' "$EVENTS_RESPONSE" || true
            exit 1
          fi
          LATEST_EVENT=$(jq -c '
            [.result.events.events[]?
             | {timestamp: (.timestamp // .["$metadata"].endTime // 0),
                message: (.["$metadata"].message // .source.message // .message // "")}
             | select(.message | contains("Website-Prüfung:"))]
            | sort_by(.timestamp) | last // {}
          ' "$EVENTS_RESPONSE")
          LATEST_MESSAGE=$(jq -r '.message // ""' <<< "$LATEST_EVENT")
          SUMMARY_TIMESTAMP=$(jq -r '.timestamp // 0' <<< "$LATEST_EVENT")
          if [[ -z "$LATEST_MESSAGE" ]]; then
            jq -c '[.result.events.events[]? | {timestamp, type: .["$metadata"].type, eventType: .["$workers"].eventType, message: (.["$metadata"].message // .source.message // .message // "")}] | .[:12]' "$EVENTS_RESPONSE" || true
            echo "::error::No website-monitor summary found after the scheduled 40-minute window."
            exit 1
          fi
          SUMMARY_JSON="${LATEST_MESSAGE#*Website-Prüfung: }"
          echo "Latest scheduled website-monitor summary: $SUMMARY_JSON"
          ACTUAL_RUN_DATE=$(jq -r '.runDate // ""' <<< "$SUMMARY_JSON")
          if [[ "$ACTUAL_RUN_DATE" != "$EXPECTED_RUN_DATE" ]]; then
            echo "::error::The monitor summary is for $ACTUAL_RUN_DATE, not today's local date $EXPECTED_RUN_DATE."
            exit 1
          fi
          if ! jq -e '
            (.totalRestaurantEntries | type == "number") and
            (.restaurantsWithoutWebsiteSource | type == "number") and
            (.totalRestaurantEntries >= 41) and
            (.restaurantsWithoutWebsiteSource >= 0) and
            (.restaurantsWithoutWebsiteSource <= .totalRestaurantEntries) and
            (.officialWebsiteCount | type == "number" and . >= 0) and
            (.externalEntryCount | type == "number" and . >= 0) and
            (.pagesChecked | type == "number" and . >= 0) and
            (.subpagesChecked | type == "number" and . >= 0) and
            (.cardsChecked | type == "number" and . >= 0) and
            (.changes | type == "number" and . >= 0) and
            (.errors | type == "number" and . >= 0) and
            (.baselineComplete == true)
          ' <<< "$SUMMARY_JSON" >/dev/null; then
            echo "::error::The daily summary has missing/invalid restaurant inventory counts or reports fewer than the 41 protected entries."
            exit 1
          fi
          echo "Verified: $(jq -r '.totalRestaurantEntries' <<< "$SUMMARY_JSON") restaurant entries; $(jq -r '.restaurantsWithoutWebsiteSource' <<< "$SUMMARY_JSON") without website/external source."
          echo "timestamp=$SUMMARY_TIMESTAMP" >> "$GITHUB_OUTPUT"
          SHARDS_COMPLETED=$(jq -r '.shardsCompleted // 0' <<< "$SUMMARY_JSON")
          if [[ "$SHARDS_COMPLETED" != "40" ]]; then
            echo "::error::The daily summary confirms only $SHARDS_COMPLETED of 40 shards."
            exit 1
          fi
          echo "Verified: the daily database summary contains all 40 unique sections."
          BASELINE_ONLY=$(jq -r '.baselineOnly // false' <<< "$SUMMARY_JSON")
          BASELINE_COMPLETE=$(jq -r '.baselineComplete // false' <<< "$SUMMARY_JSON")
          PROPOSALS=$(jq -r '.changes // -1' <<< "$SUMMARY_JSON")
          HOMEPAGE_SNAPSHOTS=$(jq -r '.homepageSnapshots // -1' <<< "$SUMMARY_JSON")
          CONFIGURED_SOURCES=$(jq -r '.configuredWebsiteSources // -1' <<< "$SUMMARY_JSON")
          SUBPAGES=$(jq -r '.subpagesChecked // -1' <<< "$SUMMARY_JSON")
          COVERAGE=$(jq -r '.baselineCoveragePercent // -1' <<< "$SUMMARY_JSON")
          if [[ "$BASELINE_COMPLETE" != "true" ]]; then
            echo "::error::The first baseline pass is not complete."
            exit 1
          fi
          if [[ "$BASELINE_ONLY" == "true" && "$PROPOSALS" != "0" ]]; then
            echo "::error::The initial baseline created change proposals; this is not allowed."
            exit 1
          fi
          if ! jq -e '
            (.homepageSnapshots | type == "number" and . >= 0) and
            (.configuredWebsiteSources | type == "number" and . >= 0) and
            (.subpagesChecked | type == "number" and . >= 0) and
            (.baselineCoveragePercent | type == "number" and . >= 0 and . <= 100) and
            (.homepageSnapshots <= .configuredWebsiteSources)
          ' <<< "$SUMMARY_JSON" >/dev/null; then
            echo "::error::Baseline coverage or subpage counts are missing or invalid."
            exit 1
          fi
          echo "Verified: baseline complete; homepage snapshots $HOMEPAGE_SNAPSHOTS/$CONFIGURED_SOURCES ($COVERAGE%); subpages $SUBPAGES."
          if [[ "$BASELINE_ONLY" == "true" ]]; then
            echo "Verified: this was the initial baseline-only pass and it created zero website change proposals."
          else
            echo "Verified: the initial baseline was completed earlier; regular comparisons are now enabled."
          fi

      - name: Verify the original baseline from read-only database state
        if: always() && (github.event_name == 'workflow_run' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(mktemp)
          STATUS=$(curl --silent --show-error --retry 3 --retry-delay 2 --output "$RESPONSE" --write-out "%{http_code}" \
            "https://tegernsee-restaurants-api.msc4021.workers.dev/monitor-health")
          echo "Read-only monitoring status HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]] || ! jq -e '.ok == true and .database == "ok"' "$RESPONSE" >/dev/null; then
            jq -c . "$RESPONSE" || true
            echo "::error::The read-only monitoring status endpoint is unavailable."
            exit 1
          fi
          if ! jq -e '
            .baseline.complete == true and
            .baseline.proposalFree == true and
            .baseline.coverageVerified == true and
            .baseline.proposalCountDuringPass == 0 and
            .baseline.baselineProposals == 0 and
            (.baseline.totalConfiguredSources | type == "number" and . > 0) and
            (.baseline.totalSnapshots | type == "number" and . >= 0) and
            (.baseline.missingSources | type == "number" and . >= 0) and
            (.baseline.missingSources <= .baseline.errorsCount) and
            (.baseline.coveragePercent | type == "number" and . >= 0 and . <= 100)
          ' "$RESPONSE" >/dev/null; then
            jq -c '.baseline' "$RESPONSE" || true
            echo "::error::The original baseline is incomplete or change proposals were created during its baseline interval."
            exit 1
          fi
          jq -r '"Verified: initial baseline from " + .baseline.source + " (" + .baseline.scope + ") completed between " + .baseline.startedAt + " and " + .baseline.finishedAt + "; zero proposals during baseline; homepage snapshots " + (.baseline.totalSnapshots|tostring) + "/" + (.baseline.totalConfiguredSources|tostring) + " (" + (.baseline.coveragePercent|tostring) + "%); missing sources " + (.baseline.missingSources|tostring) + "; baseline check errors " + (.baseline.errorsCount|tostring) + "; current snapshot coverage " + (.baseline.currentSnapshots|tostring) + "/" + (.baseline.currentConfiguredSources|tostring) + " (" + (.baseline.currentCoveragePercent|tostring) + "%)"' "$RESPONSE"
          echo "Verified: the initial baseline is complete and proposal-free."

      - name: Verify that the daily report was accepted by Brevo
        if: always() && steps.daily_audit_gate.outputs.run_daily_audit == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_RUN_DATE=$(TZ=Europe/Berlin date +%F)
          NOW_MS=$(date +%s000)
          FROM_MS=$(TZ=Europe/Berlin date -d "$EXPECTED_RUN_DATE 00:00:00" +%s000)
          EMAIL_BODY=$(jq -n --argjson from "$FROM_MS" --argjson to "$NOW_MS" '{
            queryId: "restaurant-website-monitor-email-v6",
            timeframe: {from: $from, to: $to},
            dry: false,
            view: "events",
            limit: 100,
            parameters: {
              datasets: ["cloudflare-workers"],
              filters: [
                {key: "$metadata.service", operation: "eq", type: "string", value: "tegernsee-restaurants-api"}
              ],
              needle: {value: "acceptedByProvider", isRegex: false, matchCase: false}
            }
          }')
          EMAIL_RESPONSE=$(mktemp)
          STATUS=""
          ACCEPTED_EMAIL_EVENT="{}"
          # Cloudflare telemetry ingestion is eventually consistent. Re-query for up to 90 seconds
          # before treating a missing event as a real delivery problem.
          for attempt in 1 2 3 4 5 6; do
            STATUS=$(curl --silent --show-error --retry 3 --retry-delay 2 --retry-max-time 30 --output "$EMAIL_RESPONSE" --write-out "%{http_code}" \
              --request POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$EMAIL_BODY")
            echo "Scheduled email-report telemetry API HTTP status (attempt $attempt/6): $STATUS"
            if [[ "$STATUS" != "200" ]]; then
              jq -r '.errors[]?.message // "No API error details returned."' "$EMAIL_RESPONSE" || true
              if [[ "$attempt" -eq 6 ]]; then
                echo "::error::Cloudflare telemetry API remained unavailable after retries."
                exit 1
              fi
            else
              EVENT_COUNT=$(jq -r '.result.events.events | length' "$EMAIL_RESPONSE")
              echo "Scheduled email telemetry events returned: $EVENT_COUNT"
              ACCEPTED_EMAIL_EVENT=$(jq -c --arg runDate "$EXPECTED_RUN_DATE" '
                [.result.events.events[]?
                 | {timestamp: (.timestamp // .["$metadata"].endTime // 0),
                    message: (.["$metadata"].message // .source.message // .message // "")}
                 | select(.message | contains("Restaurant-Prüfbericht:"))
                 | .message as $message
                 | (try ($message | split("Restaurant-Prüfbericht: ") | last | fromjson) catch null) as $payload
                 | select($payload != null and $payload.runDate == $runDate and $payload.sent == true and $payload.acceptedByProvider == true and ($payload.duplicateSuppressed // false) != true)
                 | {timestamp, result: $payload}]
                | sort_by(.timestamp) | last // {}
              ' "$EMAIL_RESPONSE")
              if [[ -n "$ACCEPTED_EMAIL_EVENT" && "$ACCEPTED_EMAIL_EVENT" != "{}" ]]; then
                break
              fi
            fi
            if [[ "$attempt" -lt 6 ]]; then
              echo "No accepted-email telemetry event yet; waiting 15 seconds before rechecking."
              sleep 15
            fi
          done
          if [[ -z "$ACCEPTED_EMAIL_EVENT" || "$ACCEPTED_EMAIL_EVENT" == "{}" ]]; then
            # Do not raise a false alarm when the durable monitor state already records the
            # report as sent; the following audit independently validates the persisted state.
            STATE_RESPONSE=$(mktemp)
            STATE_STATUS=$(curl --silent --show-error --retry 3 --retry-delay 2 --output "$STATE_RESPONSE" --write-out "%{http_code}" \
              "https://tegernsee-restaurants-api.msc4021.workers.dev/monitor-health")
            if [[ "$STATE_STATUS" == "200" ]] && jq -e --arg runDate "$EXPECTED_RUN_DATE" '
              .ok == true and .database == "ok" and
              .today.runDate == $runDate and .today.email.recordedAsSent == true and
              (.today.email.sentAt | type == "string" and length > 0)
            ' "$STATE_RESPONSE" >/dev/null; then
              echo "::warning::Cloudflare telemetry has not indexed the Brevo acceptance event yet; the read-only production status endpoint confirms today's report is durably recorded as sent. This is treated as telemetry delay, not a delivery failure."
              exit 0
            fi
            jq -c --arg runDate "$EXPECTED_RUN_DATE" '[.result.events.events[]?
              | {message: (.["$metadata"].message // .source.message // .message // "")}
              | select(.message | contains("Restaurant-Prüfbericht:"))
              | .message as $message
              | (try ($message | split("Restaurant-Prüfbericht: ") | last | fromjson) catch null)
              | select(. != null and .runDate == $runDate)]' "$EMAIL_RESPONSE" || true
            echo "::error::No confirmed Brevo acceptance event was found and the production status endpoint does not confirm today's report as sent."
            exit 1
          fi
          EMAIL_TIMESTAMP=$(jq -r '.timestamp // 0' <<< "$ACCEPTED_EMAIL_EVENT")
          EMAIL_JSON=$(jq -c '.result' <<< "$ACCEPTED_EMAIL_EVENT")
          echo "Actual Brevo-accepted daily email event: $EMAIL_JSON"
          echo "Provider-accepted event timestamp: $EMAIL_TIMESTAMP"
          if ! jq -e '.sent == true and .acceptedByProvider == true and ((.duplicateSuppressed // false) != true)' <<< "$EMAIL_JSON" >/dev/null; then
            echo "::error::The daily report does not contain a confirmed, non-duplicate Brevo acceptance."
            exit 1
          fi
          echo "Verified: Brevo accepted the scheduled daily restaurant report."

      - name: Verify persisted 40 sections and daily email state
        if: always() && steps.daily_audit_gate.outputs.run_daily_audit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(mktemp)
          STATUS=$(curl --silent --show-error --retry 3 --retry-delay 2 --output "$RESPONSE" --write-out "%{http_code}" \
            "https://tegernsee-restaurants-api.msc4021.workers.dev/monitor-health")
          echo "Read-only daily monitoring status HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]] || ! jq -e '.ok == true and .database == "ok"' "$RESPONSE" >/dev/null; then
            jq -c . "$RESPONSE" || true
            echo "::error::The read-only daily monitoring status endpoint is unavailable."
            exit 1
          fi
          if ! jq -e '
            .today.shardsComplete == true and
            .today.shardsStored == 40 and
            .today.distinctShards == 40 and
            .today.shardIds == [range(1; 41)] and
            .today.missingShardIds == [] and
            .today.duplicateShardIds == [] and
            .today.unexpectedShardIds == [] and
            .today.email.recordedAsSent == true and
            (.today.email.sentAt | type == "string" and length > 0)
          ' "$RESPONSE" >/dev/null; then
            jq -c '.today' "$RESPONSE" || true
            echo "::error::The database does not confirm exactly 40 distinct daily sections and a persisted successful Brevo send state."
            exit 1
          fi
          jq -r '"Verified: " + (.today.shardsStored|tostring) + " distinct sections for " + .today.runDate + "; " + (.today.summary.totalRestaurantEntries|tostring) + " restaurant entries; " + (.today.summary.restaurantsChecked|tostring) + " official websites; " + (.today.summary.externalEntriesChecked|tostring) + " external entries; " + (.today.summary.pagesChecked|tostring) + " pages; " + (.today.summary.subpagesChecked|tostring) + " subpages; " + (.today.summary.cardsChecked|tostring) + " card links; " + (.today.summary.changes|tostring) + " changes; " + (.today.summary.errors|tostring) + " problems; email state " + .today.email.status + " at " + .today.email.sentAt' "$RESPONSE"
          echo "Verified: the database has all 40 unique daily sections and the Brevo-accepted report is recorded as sent."

