name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Brevo sender configuration
        run: |
          if ! grep -Eq '^BREVO_FROM_EMAIL[[:space:]]*=[[:space:]]*"[^"]+@[^"]+"        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.90.0 deploy
 wrangler.toml; then
            echo "::error::BREVO_FROM_EMAIL fehlt oder ist ungültig in wrangler.toml. Deployment wird abgebrochen."
            exit 1
          fi
          echo "BREVO_FROM_EMAIL ist in wrangler.toml vorhanden."

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.90.0 deploy
