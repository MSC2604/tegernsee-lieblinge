name: Deploy Cloudflare Worker

# Production deployments must not race each other. Keep one active deployment
# and let the newest queued commit deploy after it.
concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - "worker.js"
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run restaurant-monitor regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test worker/*.test.mjs

      - name: Verify Brevo sender and recipient configuration
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Eq '^BREVO_FROM_EMAIL[[:space:]]*=[[:space:]]*"[^"]+@[^"]+"$' wrangler.toml; then
            echo "::error::BREVO_FROM_EMAIL fehlt oder ist ungueltig in wrangler.toml. Deployment wird abgebrochen."
            exit 1
          fi
          if ! grep -Eq '^MONITOR_NOTIFICATION_EMAIL[[:space:]]*=[[:space:]]*"[^"]+@[^"]+"$' wrangler.toml; then
            echo "::error::MONITOR_NOTIFICATION_EMAIL fehlt oder ist ungueltig in wrangler.toml. Deployment wird abgebrochen."
            exit 1
          fi
          echo "Brevo-Absender und Empfaenger sind explizit konfiguriert."

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.90.0 deploy --config ./wrangler.toml
