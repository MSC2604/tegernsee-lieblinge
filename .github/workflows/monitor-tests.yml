name: Restaurant monitoring tests

on:
  push:
    branches:
      - main
      - feature/restaurant-change-review-prototype
    paths:
      - "worker/restaurant-monitor*.mjs"
      - "worker/restaurant-monitor-schema.sql"
      - "worker/restaurant-card-fetch.mjs"
      - "worker/restaurant-card-fetch.test.mjs"
      - "worker.js"
      - ".github/workflows/monitor-tests.yml"
  pull_request:
    paths:
      - "worker/restaurant-monitor*.mjs"
      - "worker/restaurant-monitor-schema.sql"
      - "worker.js"
      - ".github/workflows/monitor-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check worker syntax
        run: node --check worker.js
      - name: Check extraction module syntax
        run: node --check worker/restaurant-monitor.mjs
      - name: Check monitoring module syntax
        run: node --check worker/restaurant-monitor-runner.mjs
      - name: Check monitoring sharding module syntax
        run: node --check worker/restaurant-monitor-sharding.mjs
      - name: Check read-only monitoring health module syntax
        run: node --check worker/restaurant-monitor-health.mjs
      - name: Test data extraction
        run: node worker/restaurant-monitor.test.mjs
      - name: Check restaurant card-fetch module syntax
        run: node --check worker/restaurant-card-fetch.mjs
      - name: Test restaurant menu document fetching
        run: node --test worker/restaurant-card-fetch.test.mjs
      - name: Check email module syntax
        run: node --check worker/restaurant-monitor-email.mjs
      - name: Test daily monitoring runner
        run: node worker/restaurant-monitor-runner.test.mjs
      - name: Test monitoring shard time windows
        run: node worker/restaurant-monitor-sharding.test.mjs
      - name: Test read-only monitoring health summary
        run: node worker/restaurant-monitor-health.test.mjs
      - name: Test email digest
        run: node worker/restaurant-monitor-email.test.mjs
