name = "tegernsee-restaurants-api"
main = "worker.js"
compatibility_date = "2026-10-16"

[vars]
BREVO_FROM_EMAIL = "msc4021@arcor.de"
MONITOR_NOTIFICATION_EMAIL = "msc4021@arcor.de"

# Cloudflare Cron is UTC-based. Two expressions cover all required UTC hours
# while staying within the Free plan's five-trigger account limit.
# Together they map to 80 shard slots (06:00-07:19 Berlin) and
# finalizer/recovery (07:30-08:59 Berlin) in both CET and CEST.
[triggers]
crons = ["0-59 4,5 * * *", "0-59 6,7 * * *"]

# Cloudflare Workers Observability: persist logs and invocation events.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
