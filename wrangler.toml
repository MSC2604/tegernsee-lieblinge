name = "tegernsee-restaurants-api"
main = "worker.js"
compatibility_date = "2026-10-16"

[vars]
BREVO_FROM_EMAIL = "msc4021@arcor.de"
MONITOR_NOTIFICATION_EMAIL = "msc4021@arcor.de"

# Cloudflare Cron is UTC-based. Trigger every minute from 04:00-04:39 and 05:00-05:39 UTC;
# worker.js runs only when the Europe/Berlin local clock is 06:00-06:39.
# This preserves 06:00 across CET and CEST without duplicate checks.
[triggers]
crons = ["0-39 4 * * *", "0-39 5 * * *"]

# Cloudflare Workers Observability: persist logs and invocation events.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
