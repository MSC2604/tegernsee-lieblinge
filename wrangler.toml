name = "tegernsee-restaurants-api"
main = "worker.js"
compatibility_date = "2026-10-16"

[vars]
BREVO_FROM_EMAIL = "msc4021@arcor.de"
MONITOR_NOTIFICATION_EMAIL = "msc4021@arcor.de"

# Cloudflare Cron is UTC-based. These windows cover 06:00-07:19 Europe/Berlin
# for the 80 shards and 07:30-07:59 local time for finalization/recovery in CET and CEST.
[triggers]
crons = ["0-59 4 * * *", "0-19 5 * * *", "20-59 5 * * *", "0-19 6 * * *", "30-59 6 * * *"]

# Cloudflare Workers Observability: persist logs and invocation events.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
