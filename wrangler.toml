name = "tegernsee-restaurants-api"
main = "worker.js"
compatibility_date = "2026-10-16"

[vars]
BREVO_FROM_EMAIL = "msc4021@arcor.de"
MONITOR_NOTIFICATION_EMAIL = "msc4021@arcor.de"

# Only the matching seasonal UTC trigger executes: 05:00-05:39 UTC in CET
# or 04:00-04:39 UTC in CEST. The scheduled handler verifies cron and Berlin time.
[triggers]
crons = ["0-39 4 * * *", "0-39 5 * * *"]

# Cloudflare Workers Observability: persist logs and invocation events.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
