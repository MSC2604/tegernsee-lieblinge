name = "tegernsee-restaurants-api"
main = "worker.js"
compatibility_date = "2026-10-16"

[vars]
BREVO_FROM_EMAIL = "msc4021@arcor.de"
MONITOR_NOTIFICATION_EMAIL = "msc4021@arcor.de"

# Cloudflare Cron is UTC-based. Four disjoint windows cover 06:00-07:19 Europe/Berlin
# in both CET and CEST. The Worker maps the local clock to 80 unique shard slots.
[triggers]
crons = ["0-59 4 * * *", "0-19 5 * * *", "20-59 5 * * *", "0-19 6 * * *"]

# Cloudflare Workers Observability: persist logs and invocation events.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
